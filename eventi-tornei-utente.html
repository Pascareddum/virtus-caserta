<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventi &amp; Tornei – Virtus Caserta</title>
  <link rel="stylesheet" href="common.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#f7f8fa;min-height:100vh;display:flex;flex-direction:column;}
    .page-wrap{flex:1;max-width:640px;width:100%;margin:0 auto;padding:32px 20px 64px;}

    /* ── top-bar ── */
    .top-bar{display:flex;align-items:center;gap:14px;margin-bottom:28px;}
    .btn-back{display:inline-flex;align-items:center;gap:6px;color:#0d2055;text-decoration:none;
      font-size:13px;font-weight:700;padding:8px 14px;border-radius:10px;border:1.5px solid #e9ecf0;
      background:#fff;transition:all .2s;}
    .btn-back:hover{border-color:#0d2055;background:#eef4ff;}
    .page-title{font-size:20px;font-weight:800;color:#0d2055;letter-spacing:-.02em;}

    /* ── sections ── */
    .sec{background:#fff;border-radius:18px;border:1.5px solid #e9ecf0;overflow:hidden;
      box-shadow:0 2px 16px rgba(13,32,85,.05);margin-bottom:20px;}
    .sec-header{display:flex;align-items:center;justify-content:space-between;
      padding:14px 20px 12px;border-bottom:1.5px solid #e9ecf0;}
    .sec-title{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#0d2055;}
    .sec-count{font-size:11px;color:#9ca3af;font-weight:600;}
    .sec-list{display:flex;flex-direction:column;}

    /* ── cards ── */
    .ev-item{display:flex;align-items:flex-start;gap:14px;padding:14px 20px;
      border-bottom:1px solid #f1f5f9;transition:background .12s;}
    .ev-item:last-child{border-bottom:none;}
    .ev-item:hover{background:#f9fafb;}
    .ev-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;
      justify-content:center;font-size:20px;flex-shrink:0;}
    .ev-icon.evento{background:#fce7f3;}
    .ev-icon.torneo{background:#ede9fe;}
    .ev-info{flex:1;min-width:0;}
    .ev-name{font-size:14px;font-weight:700;color:#111827;margin-bottom:3px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .ev-meta{font-size:11px;color:#9ca3af;margin-bottom:5px;}
    .ev-tags{display:flex;flex-wrap:wrap;gap:5px;}
    .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;}
    .tag.evento{background:#fce7f3;color:#be185d;}
    .tag.torneo{background:#ede9fe;color:#7c3aed;}
    .tag.formato{background:#e0f2fe;color:#0369a1;}
    .tag.aperto{background:#dcfce7;color:#16a34a;}
    .tag.in_corso{background:#fef3c7;color:#d97706;}
    .tag.concluso{background:#f1f5f9;color:#6b7280;}

    /* ── gironi ── */
    .girone-header{padding:10px 20px 8px;background:#f8fafc;border-bottom:1px solid #f1f5f9;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#6b7280;}
    .partita-row{display:flex;align-items:flex-start;gap:12px;padding:11px 20px;border-bottom:1px solid #f1f5f9;}
    .partita-row:last-child{border-bottom:none;}
    .partita-vs{font-size:13px;font-weight:700;color:#111827;margin-bottom:2px;}
    .partita-meta{font-size:11px;color:#9ca3af;}
    .partita-score{font-size:18px;font-weight:800;color:#0d2055;min-width:44px;text-align:center;padding-top:2px;}

    .sec-empty{padding:36px 20px;text-align:center;color:#9ca3af;font-size:13px;font-weight:600;}
    .sec-loading{padding:28px 20px;text-align:center;color:#9ca3af;}
    .spin{display:inline-block;width:18px;height:18px;border:2.5px solid #e2e8f0;
      border-top-color:#0d2055;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;}
    @keyframes spin{to{transform:rotate(360deg);}}

    @media(max-width:480px){
      .page-wrap{padding:20px 14px 48px;}
      .top-bar{gap:10px;}
      .btn-back{font-size:12px;padding:7px 12px;}
      .page-title{font-size:18px;}
      .ev-item{padding:11px 14px;gap:10px;}
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="top-bar">
      <a href="/utente" class="btn-back">← Account</a>
      <h1 class="page-title">Eventi &amp; Tornei</h1>
    </div>

    <div class="sec">
      <div class="sec-header">
        <span class="sec-title">Prossimi eventi</span>
        <span class="sec-count" id="eventiCount">—</span>
      </div>
      <div class="sec-list" id="eventiList">
        <div class="sec-loading"><div class="spin"></div> Caricamento…</div>
      </div>
    </div>

    <div class="sec" id="mieiTorneiSec" style="display:none;">
      <div class="sec-header">
        <span class="sec-title">I miei tornei</span>
        <span class="sec-count" id="mieiTorneiCount">—</span>
      </div>
      <div class="sec-list" id="mieiTorneiList">
        <div class="sec-loading"><div class="spin"></div> Caricamento…</div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-header">
        <span class="sec-title">Tornei pubblici</span>
        <span class="sec-count" id="torneiCount">—</span>
      </div>
      <div class="sec-list" id="torneiList">
        <div class="sec-loading"><div class="spin"></div> Caricamento…</div>
      </div>
    </div>
  </div>

  <script>
    fetch('/api/me').then(r=>r.json()).then(d=>{ if(!d.auth) location.replace('/login'); }).catch(()=>location.replace('/login'));

    function fmtData(ds) {
      if (!ds) return '';
      return new Date(ds + 'T00:00:00').toLocaleDateString('it-IT', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
    }

    async function loadEventi() {
      const list = document.getElementById('eventiList');
      const count = document.getElementById('eventiCount');
      try {
        const data = await fetch('/api/prossimi-eventi').then(r=>r.json());
        count.textContent = data.length + (data.length === 1 ? ' evento' : ' eventi');
        if (!data.length) {
          list.innerHTML = '<div class="sec-empty">Nessun evento in programma</div>';
          return;
        }
        list.innerHTML = data.map(ev => `
          <div class="ev-item">
            <div class="ev-icon evento">📅</div>
            <div class="ev-info">
              <div class="ev-name">${ev.titolo}</div>
              <div class="ev-meta">${fmtData(ev.data_str || ev.data)}${ev.ora ? ' · ' + ev.ora : ''}${ev.categoria ? ' · ' + ev.categoria : ''}</div>
              <div class="ev-tags"><span class="tag evento">Evento</span></div>
            </div>
          </div>`).join('');
      } catch { list.innerHTML = '<div class="sec-empty">Errore di caricamento</div>'; }
    }

    const STATO_LABEL = { aperto:'Aperto', in_corso:'In corso', concluso:'Concluso', bozza:'Bozza' };

    function fmtDataRange(t) {
      if (!t.data_inizio) return 'Data da definire';
      return fmtData(t.data_inizio) + (t.data_fine && t.data_fine !== t.data_inizio ? ' → ' + fmtData(t.data_fine) : '');
    }

    async function loadTornei() {
      const list = document.getElementById('torneiList');
      const count = document.getElementById('torneiCount');
      try {
        const data = await fetch('/api/tornei/pubblici').then(r=>r.json());
        count.textContent = data.length + (data.length === 1 ? ' torneo' : ' tornei');
        if (!data.length) {
          list.innerHTML = '<div class="sec-empty">Nessun torneo disponibile</div>';
          return;
        }
        list.innerHTML = data.map(t => `
          <div class="ev-item">
            <div class="ev-icon torneo">🏆</div>
            <div class="ev-info">
              <div class="ev-name">${t.nome}</div>
              <div class="ev-meta">${fmtDataRange(t)}${t.note ? ' · ' + t.note : ''}</div>
              <div class="ev-tags">
                <span class="tag torneo">Torneo</span>
                <span class="tag formato">${t.formato}</span>
                <span class="tag ${t.stato || ''}">${STATO_LABEL[t.stato] || t.stato}</span>
              </div>
            </div>
          </div>`).join('');
      } catch { list.innerHTML = '<div class="sec-empty">Errore di caricamento</div>'; }
    }

    async function loadMieiTornei() {
      const sec  = document.getElementById('mieiTorneiSec');
      const list = document.getElementById('mieiTorneiList');
      const count = document.getElementById('mieiTorneiCount');
      try {
        const data = await fetch('/api/tornei/miei').then(r=>r.json());
        if (!data.length) return; // section stays hidden
        sec.style.display = '';
        count.textContent = data.length + (data.length === 1 ? ' torneo' : ' tornei');
        list.innerHTML = data.map(t => {
          const gironi = t.gironi || [];
          const partite = t.partite || [];
          const partiteLibere = partite.filter(p => !p.girone_id);

          const renderPartita = p => {
            const cn = p.squadra_casa?.nome   || '?';
            const on = p.squadra_ospite?.nome || '?';
            const cc = p.squadra_casa?.colore   || '#3b82f6';
            const co = p.squadra_ospite?.colore || '#ef4444';
            const score = (p.risultato_casa != null && p.risultato_ospite != null)
              ? `${p.risultato_casa}–${p.risultato_ospite}` : '';
            const meta = [p.data_str ? fmtData(p.data_str) : null, p.ora, p.luogo].filter(Boolean).join(' · ');
            return `<div class="partita-row">
              <div style="flex:1;min-width:0;">
                <div class="partita-vs">
                  <span style="color:${cc};">${cn}</span>
                  <span style="color:#9ca3af;font-weight:400;margin:0 6px;">vs</span>
                  <span style="color:${co};">${on}</span>
                </div>
                ${meta ? `<div class="partita-meta">${meta}</div>` : ''}
              </div>
              ${score ? `<div class="partita-score">${score}</div>` : ''}
              ${p.stato === 'completata' ? '<span class="tag concluso" style="font-size:10px;padding:2px 7px;">Fine</span>' : ''}
            </div>`;
          };

          const gironiHtml = gironi.map(g => {
            const gp = partite.filter(p => p.girone_id === g.id);
            return `<div class="girone-header">${g.nome}</div>
              ${gp.length ? gp.map(renderPartita).join('') : '<div style="padding:8px 20px;font-size:12px;color:#9ca3af;">Nessuna partita</div>'}`;
          }).join('');

          const libereHtml = partiteLibere.length
            ? `${gironi.length ? '<div class="girone-header">Partite</div>' : ''}${partiteLibere.map(renderPartita).join('')}`
            : '';

          const headerHtml = `<div class="ev-item" style="border-bottom:1.5px solid #f1f5f9;padding-bottom:12px;">
            <div class="ev-icon torneo">🏆</div>
            <div class="ev-info">
              <div class="ev-name">${t.nome}</div>
              <div class="ev-meta">${fmtDataRange(t)}</div>
              <div class="ev-tags">
                <span class="tag formato">${t.formato}</span>
                <span class="tag ${t.stato || ''}">${STATO_LABEL[t.stato] || t.stato}</span>
              </div>
            </div>
          </div>`;

          const body = gironiHtml + libereHtml;
          return `<div style="margin-bottom:0;">${headerHtml}${body || '<div style="padding:12px 20px;font-size:12px;color:#9ca3af;">Nessuna partita programmata.</div>'}</div>`;
        }).join('<div style="height:1px;background:#f1f5f9;"></div>');
      } catch { /* silent — section stays hidden */ }
    }

    loadEventi();
    loadTornei();
    loadMieiTornei();
  </script>
</body>
</html>
