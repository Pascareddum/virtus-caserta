<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/images/favicon/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/images/favicon/site.webmanifest">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convocazioni – Virtus Caserta</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body{font-family:'Segoe UI',Arial,sans-serif;background:#f7f8fa;min-height:100vh;display:flex;flex-direction:column;}
    .page-wrap{flex:1;max-width:660px;width:100%;margin:0 auto;padding:32px 20px 80px;}

    .top-bar{display:flex;align-items:center;gap:14px;margin-bottom:24px;}
    .btn-back{display:inline-flex;align-items:center;gap:6px;color:#0d2055;text-decoration:none;
      font-size:13px;font-weight:700;padding:8px 14px;border-radius:10px;border:1.5px solid #e9ecf0;
      background:#fff;transition:all .2s;}
    .btn-back:hover{border-color:#0d2055;background:#eef4ff;}
    .page-title{font-size:20px;font-weight:800;color:#0d2055;letter-spacing:-.02em;}

    /* ── Event cards ── */
    .event-card{background:#fff;border-radius:18px;border:1.5px solid #e9ecf0;overflow:hidden;
      margin-bottom:16px;box-shadow:0 2px 12px rgba(13,32,85,.05);}
    .event-header{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;
      transition:background .12s;}
    .event-header:hover{background:#f9fafb;}
    .event-type-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
    .event-info{flex:1;min-width:0;}
    .event-title{font-size:15px;font-weight:800;color:#111827;}
    .event-meta{font-size:12px;color:#9ca3af;margin-top:2px;display:flex;flex-wrap:wrap;gap:8px;}
    .event-badge{font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap;}
    .badge-allenamento{background:#eef4ff;color:#1d4ed8;}
    .badge-partita{background:#f0fdf4;color:#15803d;}
    .badge-evento{background:#fff0f3;color:#be123c;}
    .event-stats{display:flex;gap:14px;flex-shrink:0;}
    .ev-stat{text-align:center;}
    .ev-stat-n{font-size:16px;font-weight:800;}
    .ev-stat-l{font-size:9px;color:#9ca3af;font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
    .ev-stat-n.si{color:#16a34a;}
    .ev-stat-n.no{color:#dc2626;}
    .ev-stat-n.nd{color:#f59e0b;}
    .expand-ico{color:#d1d5db;font-size:16px;transition:transform .2s;flex-shrink:0;}
    .event-card.open .expand-ico{transform:rotate(90deg);}

    /* ── Atleti list inside card ── */
    .event-body{display:none;border-top:1.5px solid #e9ecf0;}
    .event-card.open .event-body{display:block;}
    .convoca-toolbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;
      border-bottom:1px solid #f1f5f9;flex-wrap:wrap;gap:8px;}
    .convoca-toolbar-left{display:flex;gap:8px;}
    .btn-convoca-all{padding:7px 14px;background:#0d2055;color:#fff;border:none;border-radius:8px;
      font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .2s;}
    .btn-convoca-all:hover{background:#1535a8;}
    .btn-remind{padding:7px 14px;background:#fff;color:#f57c00;border:1.5px solid #fed7aa;border-radius:8px;
      font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
    .btn-remind:hover{background:#fff7ed;}
    .atleta-conv-row{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid #f1f5f9;}
    .atleta-conv-row:last-child{border-bottom:none;}
    .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(140deg,#0d2055,#1e4bd8);
      display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0;}
    .conv-name{font-size:13px;font-weight:700;color:#111827;flex:1;}
    .conv-sub{font-size:11px;color:#9ca3af;}
    .rsvp-indicator{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;}
    .rsvp-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .rsvp-si .rsvp-dot{background:#16a34a;}
    .rsvp-si{color:#15803d;}
    .rsvp-no .rsvp-dot{background:#dc2626;}
    .rsvp-no{color:#b91c1c;}
    .rsvp-nd .rsvp-dot{background:#f59e0b;}
    .rsvp-nd{color:#92400e;}
    .btn-toggle-conv{padding:5px 12px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;
      font-family:inherit;transition:all .2s;}
    .btn-toggle-conv.on{background:#eef4ff;color:#0d2055;border:1.5px solid #c7d2fe;}
    .btn-toggle-conv.off{background:#fff;color:#9ca3af;border:1.5px solid #e9ecf0;}
    .btn-toggle-conv:hover{border-color:#0d2055;color:#0d2055;}

    /* ── Empty / loading ── */
    .page-empty{padding:60px 20px;text-align:center;color:#9ca3af;font-size:14px;font-weight:600;}
    .spin{display:inline-block;width:18px;height:18px;border:2.5px solid #e2e8f0;border-top-color:#0d2055;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* ── Toast ── */
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#111827;color:#fff;
      padding:10px 20px;border-radius:50px;font-size:13px;font-weight:600;opacity:0;transition:transform .3s,opacity .3s;z-index:900;white-space:nowrap;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .toast.err{background:#dc2626;}

    .section-label{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#9ca3af;margin-bottom:14px;}

    /* ── Presence toggle ── */
    .p-toggle{display:flex;border-radius:8px;overflow:hidden;border:1.5px solid #e9ecf0;}
    .p-btn{padding:5px 11px;border:none;background:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:#9ca3af;transition:all .12s;}
    .p-btn.si.on{background:#dcfce7;color:#16a34a;}
    .p-btn.no.on{background:#fee2e2;color:#dc2626;}
    .p-btn:not(.on):hover{background:#f1f5f9;}

    @media(max-width:480px){
      .page-wrap{padding:20px 14px 60px;}
      .event-stats{gap:10px;}
      .ev-stat-n{font-size:14px;}
      .convoca-toolbar{padding:10px 16px;}
      .atleta-conv-row{padding:10px 16px;}
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="top-bar">
      <a href="gestione-squadra.html" class="btn-back">← Squadra</a>
      <h1 class="page-title">Convocazioni</h1>
    </div>

    <div class="section-label">Prossimi eventi</div>
    <div id="eventiList">
      <div class="page-empty"><div class="spin"></div> Caricamento…</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    fetch('/api/me').then(r=>r.json()).then(d=>{ if(!d.auth) location.replace('/login'); }).catch(()=>location.replace('/login'));
    const _tok = '';

    const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
    const GG   = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];

    // sessId → { players: [], convMap: { key → risposta } }
    let sessionsData = {};

    function toast(msg, err = false) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
      clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 3000);
    }

    function fmtDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso.includes('T') ? iso : iso + 'T00:00');
      return `${GG[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`;
    }

    function rsvpLabel(val) {
      if (val === 'si') return '<span class="rsvp-indicator rsvp-si"><span class="rsvp-dot"></span>Presente</span>';
      if (val === 'no') return '<span class="rsvp-indicator rsvp-no"><span class="rsvp-dot"></span>Assente</span>';
      return '<span class="rsvp-indicator rsvp-nd"><span class="rsvp-dot"></span>Non risposto</span>';
    }

    function buildConvRows(evId) {
      const sd = sessionsData[evId];
      if (!sd) return '<div style="padding:16px;text-align:center;color:#9ca3af;font-size:13px;"><div class="spin"></div> Caricamento…</div>';
      const { players, convMap } = sd;
      if (!players.length) return '<div style="padding:16px;text-align:center;color:#9ca3af;font-size:13px;">Nessun giocatore per questo allenamento</div>';
      return players.map(g => {
        const rsvp = convMap[g.id] ?? null;
        const siOn = rsvp === 'si' ? 'on' : '';
        const noOn = rsvp === 'no' ? 'on' : '';
        const ini  = (g.cognome?.[0] || '') + (g.nome?.[0] || '');
        const sub  = [g.sesso, g.ruolo, g.has_account ? null : 'solo rosa'].filter(Boolean).join(' · ');
        return `<div class="atleta-conv-row">
          <div class="av">${ini.toUpperCase() || '?'}</div>
          <div style="flex:1;min-width:0;">
            <div class="conv-name">${g.cognome || ''} ${g.nome || ''}</div>
            <div class="conv-sub">${sub}</div>
          </div>
          ${rsvpLabel(rsvp)}
          <div class="p-toggle">
            <button class="p-btn si ${siOn}" onclick="setPresenzaConv('${evId}','${g.id}','si',this)" title="Presente">✓</button>
            <button class="p-btn no ${noOn}" onclick="setPresenzaConv('${evId}','${g.id}','no',this)" title="Assente">✗</button>
          </div>
        </div>`;
      }).join('');
    }

    function refreshStats(card, evId) {
      const sd = sessionsData[evId];
      if (!sd) return;
      const { convMap } = sd;
      const si = Object.values(convMap).filter(v => v === 'si').length;
      const no = Object.values(convMap).filter(v => v === 'no').length;
      const nums = card.querySelectorAll('.ev-stat-n');
      if (nums[0]) nums[0].textContent = si;
      if (nums[1]) nums[1].textContent = no;
    }

    function buildEventCard(ev) {
      const card = document.createElement('div');
      card.className = 'event-card';
      card.dataset.id = ev.id;
      card.innerHTML = `
        <div class="event-header">
          <div class="event-type-dot" style="background:#0d2055"></div>
          <div class="event-info">
            <div class="event-title">${ev.titolo}</div>
            <div class="event-meta">
              <span class="event-badge badge-allenamento">Allenamento</span>
              <span>${fmtDate(ev.data)}${ev.ora ? ' · ' + ev.ora : ''}</span>
            </div>
          </div>
          <div class="event-stats">
            <div class="ev-stat"><div class="ev-stat-n si" id="si-${ev.id}">—</div><div class="ev-stat-l">Sì</div></div>
            <div class="ev-stat"><div class="ev-stat-n no" id="no-${ev.id}">—</div><div class="ev-stat-l">No</div></div>
          </div>
          <span class="expand-ico">›</span>
        </div>
        <div class="event-body">
          <div class="convoca-toolbar">
            <div class="convoca-toolbar-left">
              <button class="btn-convoca-all" onclick="convocaTutti('${ev.id}')">Tutti presenti</button>
            </div>
          </div>
          <div id="convList-${ev.id}"><div style="padding:16px;text-align:center;color:#9ca3af;font-size:13px;"><div class="spin"></div></div></div>
        </div>`;
      card.querySelector('.event-header').addEventListener('click', () => toggleCard(card, ev.id));
      return card;
    }

    function toggleCard(card, evId) {
      const isOpen = card.classList.contains('open');
      document.querySelectorAll('.event-card.open').forEach(c => c.classList.remove('open'));
      if (!isOpen) {
        card.classList.add('open');
        if (!sessionsData[evId]) {
          loadPresenze(evId, card);
        } else {
          document.getElementById('convList-' + evId).innerHTML = buildConvRows(evId);
        }
      }
    }

    async function loadPresenze(evId, card) {
      try {
        const data = await fetch(`/api/allenatore/sessioni/${evId}/presenze`, { headers: { Authorization: `Bearer ${_tok}` } }).then(r => r.json());
        const convMap = {};
        (data.giocatori || []).forEach(g => { convMap[g.id] = g.risposta; });
        sessionsData[evId] = { players: data.giocatori || [], convMap };
        const listEl = document.getElementById('convList-' + evId);
        if (listEl) listEl.innerHTML = buildConvRows(evId);
        refreshStats(card, evId);
      } catch {
        const listEl = document.getElementById('convList-' + evId);
        if (listEl) listEl.innerHTML = '<div style="padding:16px;text-align:center;color:#dc2626;font-size:13px;">Errore caricamento</div>';
      }
    }

    window.setPresenzaConv = async function(evId, playerId, risposta, btn) {
      const sd = sessionsData[evId];
      if (!sd) return;
      const toggle = btn.closest('.p-toggle');
      toggle.querySelectorAll('.p-btn').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      try {
        await fetch(`/api/allenatore/sessioni/${evId}/presenze/${encodeURIComponent(playerId)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_tok}` },
          body: JSON.stringify({ risposta }),
        });
        sd.convMap[playerId] = risposta;
        // update rsvp label inline
        const row = btn.closest('.atleta-conv-row');
        if (row) {
          const labelEl = row.querySelector('.rsvp-indicator');
          if (labelEl) labelEl.outerHTML = rsvpLabel(risposta);
        }
        const card = document.querySelector(`.event-card[data-id="${evId}"]`);
        if (card) refreshStats(card, evId);
      } catch {
        toggle.querySelectorAll('.p-btn').forEach(b => b.classList.remove('on'));
        const cur = sd.convMap[playerId];
        if (cur) toggle.querySelector('.p-btn.' + cur)?.classList.add('on');
        toast('Errore salvataggio', true);
      }
    };

    window.convocaTutti = async function(evId) {
      const sd = sessionsData[evId];
      if (!sd || !sd.players.length) return;
      try {
        await Promise.all(sd.players.map(g =>
          fetch(`/api/allenatore/sessioni/${evId}/presenze/${encodeURIComponent(g.id)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_tok}` },
            body: JSON.stringify({ risposta: 'si' }),
          })
        ));
        sd.players.forEach(g => { sd.convMap[g.id] = 'si'; });
        const listEl = document.getElementById('convList-' + evId);
        if (listEl) listEl.innerHTML = buildConvRows(evId);
        const card = document.querySelector(`.event-card[data-id="${evId}"]`);
        if (card) refreshStats(card, evId);
        toast('Tutti segnati presenti');
      } catch { toast('Errore', true); }
    };

    async function carica() {
      const container = document.getElementById('eventiList');
      try {
        const sessioni = await fetch('/api/allenatore/sessioni', { headers: { Authorization: `Bearer ${_tok}` } }).then(r => r.json());
        if (!Array.isArray(sessioni) || !sessioni.length) {
          container.innerHTML = '<div class="page-empty">Nessun allenamento programmato</div>';
          return;
        }
        // Show all (already ordered desc from server; reverse for asc display)
        const ordinati = [...sessioni].reverse();
        container.innerHTML = '';
        ordinati.forEach(ev => container.appendChild(buildEventCard(ev)));
      } catch {
        container.innerHTML = '<div class="page-empty">Impossibile caricare gli allenamenti</div>';
      }
    }

    carica();
  </script>
</body>
</html>
