<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario – Virtus Caserta</title>
  <meta name="description" content="Calendario allenamenti e partite di Virtus Caserta ASD.">
  <meta property="og:title" content="Calendario – Virtus Caserta">
  <meta property="og:image" content="/images/logo.png">
  <link rel="stylesheet" href="common.css">
  <style>
    :root {
      --blu:    #0d2055;
      --blu2:   #1535a8;
      --arancio:#f57c00;
      --bianco: #ffffff;
      --bg:     #f0f4f8;
      --bordo:  #e2e8f0;
      --testo:  #1e293b;
      --sub:    #64748b;
      --ca:     #0d2055;   /* allenamento */
      --cs:     #059669;   /* fipav senior */
      --cu:     #7c3aed;   /* fipav under  */
      --co:     #ea580c;   /* opes         */
      --ce:     #e11d48;   /* evento       */
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{font-family:-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--testo);min-height:100vh;}

    /* ── NAV ── */
    nav{position:fixed;top:0;left:0;width:100%;z-index:200;
      background:var(--blu);height:68px;
      display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 28px;
      box-shadow:0 2px 20px rgba(13,32,85,.5);}
    .nav-left{display:flex;align-items:center;justify-content:flex-start;}
    .nav-back{color:rgba(255,255,255,.75);text-decoration:none;font-size:12px;font-weight:700;
      letter-spacing:1.5px;text-transform:uppercase;padding:7px 14px;border-radius:8px;
      border:1px solid rgba(255,255,255,.2);transition:all .2s;}
    .nav-back:hover{background:rgba(255,255,255,.12);color:#fff;}
    .nav-brand{display:flex;align-items:center;justify-content:center;text-decoration:none;}
    .nav-brand img{height:44px;width:auto;object-fit:contain;}
    .nav-right{display:flex;align-items:center;justify-content:flex-start;}

    /* ── PAGE WRAPPER ── */
    .page{margin-top:68px;display:flex;flex-direction:column;min-height:calc(100vh - 68px);}

    /* ── SETTIMANA HEADER ── */
    .sett-header{
      background:var(--blu);
      padding:20px 24px 0;
      display:flex;flex-direction:column;gap:0;
    }
    .sett-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
    .sett-range{
      font-size:17px;font-weight:800;color:#fff;letter-spacing:.5px;
      text-align:center;flex:1;
    }
    .sett-range span{font-size:13px;font-weight:500;color:rgba(255,255,255,.55);margin-left:10px;}
    .btn-sett-nav{
      background:rgba(255,255,255,.12);border:none;color:#fff;
      width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;transition:background .2s;flex-shrink:0;
    }
    .btn-sett-nav:hover{background:rgba(255,255,255,.24);}
    .sett-oggi-row{display:flex;justify-content:center;padding-bottom:16px;}
    .btn-oggi{
      background:rgba(255,255,255,.13);border:1.5px solid rgba(255,255,255,.28);color:rgba(255,255,255,.85);
      font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
      padding:7px 22px;border-radius:20px;cursor:pointer;transition:all .2s;
    }
    .btn-oggi:hover{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.55);color:#fff;}

    /* ── FILTRI ── */
    .filtri-wrap{
      background:var(--blu);
      padding:0 24px 18px;
      display:flex;gap:8px;flex-wrap:wrap;
    }
    .fpill{
      display:flex;align-items:center;gap:5px;
      padding:5px 13px;border-radius:20px;border:1.5px solid rgba(255,255,255,.2);
      font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
      color:rgba(255,255,255,.65);cursor:pointer;transition:all .18s;background:transparent;
      white-space:nowrap;
    }
    .fpill .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
    .fpill.on{color:#fff;border-color:transparent;}
    .fpill[data-c="tutte"].on      {background:rgba(255,255,255,.18);}
    .fpill[data-c="allenamento"].on{background:var(--ca);}
    .fpill[data-c="fipav-senior"].on{background:var(--cs);}
    .fpill[data-c="fipav-under"].on {background:var(--cu);}
    .fpill[data-c="opes"].on       {background:var(--co);}
    .fpill[data-c="evento"].on     {background:var(--ce);}

    /* ── SCROLL WRAP (solo griglia, header sincronizzato via JS) ── */
    .cal-scroll-wrap{flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch;}

    /* ── GIORNI INTESTAZIONE ── */
    .giorni-head{
      display:grid;grid-template-columns:44px repeat(7,1fr);
      background:var(--bianco);
      border-bottom:2px solid var(--bordo);
      position:sticky;top:68px;z-index:100;
      box-shadow:0 2px 8px rgba(0,0,0,.06);
      min-width:744px;
      overflow-x:hidden;
    }
    .gh-spacer{border-right:1px solid var(--bordo);background:var(--bianco);}
    .gh-cell{
      padding:12px 4px 10px;text-align:center;
      border-right:1px solid var(--bordo);
    }
    .gh-cell:last-child{border-right:none;}
    .gh-nome{font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;}
    .gh-num{
      width:34px;height:34px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:16px;font-weight:700;color:var(--testo);
      margin:0 auto;
    }
    .gh-cell.oggi .gh-num{background:var(--arancio);color:#fff;}
    .gh-cell.oggi .gh-nome{color:var(--arancio);}
    .gh-cell.domenica .gh-num{color:#dc2626;}
    .gh-cell.domenica .gh-nome{color:#dc2626;}
    .gh-cell.passato .gh-num{color:#cbd5e1;}
    .gh-cell.passato .gh-nome{color:#cbd5e1;}

    /* ── WEEK GRID (time-based) ── */
    .week-grid{
      display:grid;grid-template-columns:44px repeat(7,1fr);
      border-bottom:1px solid var(--bordo);
      min-width:744px;
    }

    /* ── TIME GUTTER ── */
    .time-gutter{
      position:relative;
      height:840px; /* 14h × 60px */
      border-right:1px solid var(--bordo);
      background:var(--bianco);
      flex-shrink:0;
    }
    .time-lbl{
      position:absolute;right:6px;
      font-size:9px;font-weight:700;color:var(--sub);
      letter-spacing:.2px;transform:translateY(-50%);
      white-space:nowrap;user-select:none;
    }

    /* ── DAY COLUMN (time grid) ── */
    .day-col{
      position:relative;
      height:840px;
      border-right:1px solid var(--bordo);
      overflow:hidden;
    }
    .day-col:last-child{border-right:none;}
    .day-col.oggi-col{background:rgba(245,124,0,.02);}
    .day-col.passato-col{background:#fafbfc;}

    /* ── HOUR LINES ── */
    .hour-line{
      position:absolute;left:0;right:0;height:0;
      border-top:1px solid #eef2f7;pointer-events:none;
    }
    .hour-line.half{border-top-style:dashed;opacity:.4;}

    /* ── EVENTO CARD (absolute) ── */
    .ev{
      position:absolute;left:3px;right:3px;
      border-radius:7px;
      padding:4px 7px 3px;
      font-size:11px;
      cursor:pointer;
      border-left:3px solid transparent;
      transition:box-shadow .15s,filter .15s;
      background:#fff;
      box-shadow:0 1px 4px rgba(0,0,0,.1);
      overflow:hidden;
      z-index:2;
      min-height:26px;
    }
    .ev:hover{box-shadow:0 3px 12px rgba(0,0,0,.16);filter:brightness(.97);}
    .ev.ev-allenamento {border-left-color:var(--ca);background:rgba(13,32,85,.05);}
    .ev.ev-fipav-senior{border-left-color:var(--cs);background:rgba(5,150,105,.05);}
    .ev.ev-fipav-under {border-left-color:var(--cu);background:rgba(124,58,237,.05);}
    .ev.ev-opes        {border-left-color:var(--co);background:rgba(234,88,12,.05);}
    .ev.ev-evento      {border-left-color:var(--ce);background:rgba(225,29,72,.06);border-left-width:4px;}
    .badge-e{background:rgba(225,29,72,.12);color:var(--ce);}
    .ev-time{font-size:10px;font-weight:700;color:var(--sub);line-height:1.2;letter-spacing:.2px;}
    .ev-title{font-size:11px;font-weight:700;color:var(--testo);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .ev-sub{font-size:10px;color:var(--sub);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .ev-badge{
      display:inline-block;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
      padding:1px 5px;border-radius:4px;margin-top:2px;
    }
    .badge-a{background:rgba(13,32,85,.12);color:var(--ca);}
    .badge-s{background:rgba(5,150,105,.12);color:var(--cs);}
    .badge-u{background:rgba(124,58,237,.12);color:var(--cu);}
    .badge-o{background:rgba(234,88,12,.12);color:var(--co);}
    /* No-time chip strip at top of column */
    .no-time-strip{
      position:absolute;top:2px;left:2px;right:2px;
      display:flex;flex-direction:column;gap:2px;z-index:3;
    }
    .ev-chip{
      border-radius:5px;padding:2px 6px;font-size:10px;font-weight:700;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;
      border-left:3px solid transparent;background:#fff;
      box-shadow:0 1px 3px rgba(0,0,0,.08);
    }
    .ev-chip:hover{filter:brightness(.95);}
    /* Current time indicator */
    .now-line{
      position:absolute;left:0;right:0;height:2px;
      background:var(--arancio);z-index:10;pointer-events:none;
    }
    .now-dot{
      position:absolute;left:-4px;top:-4px;
      width:10px;height:10px;border-radius:50%;background:var(--arancio);
    }

    /* ── LEGENDA ── */
    .legenda{
      display:flex;align-items:center;gap:20px;flex-wrap:wrap;
      padding:14px 24px;background:#fff;border-top:1px solid var(--bordo);
      font-size:12px;color:var(--sub);
    }
    .legenda-item{display:flex;align-items:center;gap:6px;font-weight:600;}
    .legenda-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}

    /* ── NOTICE ALLENAMENTI ── */
    .notice-allenamenti{
      display:flex;align-items:center;gap:8px;
      padding:0 20px;max-height:0;overflow:hidden;opacity:0;
      background:rgba(13,32,85,.06);
      border-bottom:1px solid transparent;
      font-size:12px;color:var(--sub);font-weight:500;
      transition:max-height .35s ease,opacity .3s ease,padding .3s ease,border-color .3s ease;
    }
    .notice-allenamenti.visible{
      max-height:50px;opacity:1;padding:9px 20px;border-bottom-color:var(--bordo);
    }

    /* ── LOADING / EMPTY ── */
    .loading-overlay{
      display:flex;align-items:center;justify-content:center;
      padding:60px;color:var(--sub);font-size:14px;gap:10px;
    }
    .spin{width:20px;height:20px;border:2.5px solid #e2e8f0;border-top-color:var(--blu);border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* ── MODAL DETTAGLIO EVENTO ── */
    .modal-bg{
      display:none;position:fixed;inset:0;z-index:500;
      background:rgba(0,0,0,.5);backdrop-filter:blur(6px);
      align-items:center;justify-content:center;padding:20px;
    }
    .modal-bg.open{display:flex;}
    .modal-box{
      background:#fff;border-radius:22px;
      width:100%;max-width:420px;overflow:hidden;
      box-shadow:0 32px 80px rgba(0,0,0,.22),0 8px 24px rgba(0,0,0,.12);
    }
    .dm-accent{height:4px;width:100%;}
    .dm-hdr{
      display:flex;align-items:flex-start;justify-content:space-between;
      padding:20px 22px 16px;gap:12px;border-bottom:1px solid #f1f5f9;
    }
    .dm-hdr-left{flex:1;min-width:0;}
    .dm-tag{
      display:inline-block;font-size:10px;font-weight:700;letter-spacing:.8px;
      text-transform:uppercase;padding:3px 10px;border-radius:20px;
      color:#fff;margin-bottom:9px;
    }
    .dm-title{font-size:18px;font-weight:800;color:var(--testo);line-height:1.25;}
    .dm-close{
      width:30px;height:30px;border-radius:50%;border:none;
      background:#f1f5f9;color:#6b7280;font-size:14px;
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      flex-shrink:0;transition:background .15s,color .15s;margin-top:2px;
    }
    .dm-close:hover{background:#e2e8f0;color:var(--testo);}
    .dm-photo{width:100%;max-height:190px;object-fit:cover;display:block;}
    .dm-info{padding:16px 22px;display:flex;flex-direction:column;gap:11px;}
    .dm-field{display:flex;flex-direction:column;gap:2px;}
    .dm-lbl{font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.7px;}
    .dm-val{font-size:14px;color:var(--testo);font-weight:500;line-height:1.4;}
    .dm-val strong{font-weight:700;}
    .dm-val-badge{
      display:inline-block;padding:2px 10px;border-radius:20px;
      font-size:12px;font-weight:700;background:#fef3c7;color:#92400e;
    }
    .dm-val-badge.rinviata{background:#fee2e2;color:#991b1b;}
    /* RSVP */
    .dm-rsvp{padding:14px 22px 20px;border-top:1px solid #f1f5f9;}
    .dm-rsvp-lbl{font-size:10px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px;}
    .rsvp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .rsvp-card{
      padding:12px 10px;border-radius:12px;border:1.5px solid #e5e7eb;
      background:none;cursor:pointer;font-family:inherit;
      display:flex;align-items:center;justify-content:center;gap:7px;
      font-size:13px;font-weight:600;color:#6b7280;
      transition:all .18s;
    }
    .rsvp-card:hover:not(.active){background:#f9fafb;border-color:#d1d5db;}
    .rsvp-card .rsvp-dot{
      width:8px;height:8px;border-radius:50%;
      border:2px solid #d1d5db;flex-shrink:0;transition:all .18s;
    }
    .rsvp-card.si.active{border-color:#16a34a;background:#f0fdf4;color:#15803d;}
    .rsvp-card.si.active .rsvp-dot{background:#16a34a;border-color:#16a34a;}
    .rsvp-card.no.active{border-color:#dc2626;background:#fef2f2;color:#b91c1c;}
    .rsvp-card.no.active .rsvp-dot{background:#dc2626;border-color:#dc2626;}
    /* legacy classes kept for add-modal close btn */
    .modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--sub);line-height:1;flex-shrink:0;}
    .modal-close:hover{color:var(--testo);}

    /* ── MODAL AGGIUNGI (admin) ── */
    .add-modal-bg{
      display:none;position:fixed;inset:0;z-index:600;
      background:rgba(0,0,0,.45);backdrop-filter:blur(4px);
      align-items:center;justify-content:center;padding:20px;
    }
    .add-modal-bg.open{display:flex;}
    .add-modal-box{
      background:#fff;border-radius:20px;padding:28px 24px;
      width:100%;max-width:420px;
      box-shadow:0 24px 64px rgba(0,0,0,.25);
    }
    .am-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
    .am-hdr h3{font-size:17px;font-weight:800;color:var(--testo);}
    .mf{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
    .mf label{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.7px;}
    .mf input,.mf select,.mf textarea{
      padding:10px 13px;border:1.5px solid var(--bordo);border-radius:10px;
      font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;width:100%;
    }
    .mf input:focus,.mf select:focus,.mf textarea:focus{border-color:var(--blu);}
    .mf textarea{resize:vertical;min-height:64px;}
    .mf-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .am-ftr{display:flex;gap:10px;margin-top:6px;}
    .btn-cancel{flex:1;padding:12px;border:1.5px solid var(--bordo);background:none;border-radius:50px;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s;color:var(--sub);}
    .btn-cancel:hover{background:#f1f5f9;}
    .btn-add{flex:2;padding:12px;border:none;background:var(--blu);color:#fff;border-radius:50px;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .2s;}
    .btn-add:hover{opacity:.88;}
    .btn-add:disabled{opacity:.5;cursor:not-allowed;}

    /* ── FAB ── */
    .fab{
      display:none;position:fixed;bottom:28px;right:28px;z-index:300;
      width:54px;height:54px;border-radius:50%;
      background:var(--arancio);color:#fff;border:none;font-size:26px;
      cursor:pointer;box-shadow:0 4px 20px rgba(234,88,12,.45);
      align-items:center;justify-content:center;transition:transform .2s,box-shadow .2s;
    }
    .fab:hover{transform:scale(1.1);box-shadow:0 6px 28px rgba(234,88,12,.55);}

    /* ── TABLET (600–900px): scroll orizzontale griglia ── */
    @media(max-width:900px){
      .week-grid{grid-template-columns:44px repeat(7,minmax(100px,1fr));min-width:744px;}
      .giorni-head{grid-template-columns:44px repeat(7,minmax(100px,1fr));min-width:744px;}
      .sett-header,.filtri-wrap{padding-left:18px;padding-right:18px;}
      .ev{font-size:10.5px;}
      .ev-title{font-size:10.5px;}
    }
    .nav-brand-label{display:none!important;}

    /* ── MOBILE (<600px): day-strip view ── */
    @media(max-width:600px){
      nav{padding:0 14px;height:60px;}
      .nav-brand img{height:36px;}
      .nav-back{font-size:11px;padding:5px 10px;letter-spacing:1px;}
      .page{margin-top:60px;}
      .sett-range{font-size:14px;}
      .sett-header{padding:14px 14px 0;}
      .sett-oggi-row{padding-bottom:12px;}
      .filtri-wrap{padding:0 14px 14px;gap:6px;}
      .fpill{font-size:10px;padding:5px 11px;}
      .giorni-head{display:none;}
      .week-grid{display:none;}
      .cal-scroll-wrap{display:none;}
      .legenda{display:none;}
      .mobile-view{display:block !important;}
    }

    /* ── MOBILE VIEW ── */
    .mobile-view{display:none;}
    .day-strip{
      display:flex;gap:0;overflow-x:auto;background:#fff;
      border-bottom:2px solid var(--bordo);scrollbar-width:none;
      position:sticky;top:60px;z-index:90;
    }
    .day-strip::-webkit-scrollbar{display:none;}
    .ds-cell{
      flex-shrink:0;width:calc(100vw / 7);min-width:42px;
      padding:10px 2px 8px;text-align:center;cursor:pointer;
      border-bottom:3px solid transparent;transition:all .15s;
    }
    .ds-cell .ds-nome{font-size:9px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;}
    .ds-cell .ds-num{
      font-size:15px;font-weight:700;color:var(--testo);
      width:34px;height:34px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      margin:3px auto;transition:background .15s,color .15s;
    }
    .ds-cell.selected{border-bottom-color:var(--blu);}
    .ds-cell.selected .ds-num{background:var(--blu);color:#fff;}
    .ds-cell.oggi-strip .ds-num{background:var(--arancio);color:#fff;}
    .ds-cell.oggi-strip.selected .ds-num{background:var(--blu);color:#fff;}
    .ds-cell.domenica-strip .ds-num{color:#dc2626;}
    .ds-cell.passato-strip .ds-num{color:#cbd5e1;}
    .ds-dots{display:flex;justify-content:center;gap:3px;min-height:7px;margin-top:2px;}
    .ds-dot{width:5px;height:5px;border-radius:50%;}

    .mobile-events{padding:14px 14px 80px;}
    .mob-date-label{
      font-size:12px;font-weight:700;color:var(--sub);
      text-transform:uppercase;letter-spacing:1px;
      margin-bottom:14px;padding-bottom:8px;
      border-bottom:1px solid var(--bordo);
    }
    .mob-ev{
      background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;
      display:flex;gap:14px;align-items:stretch;
      box-shadow:0 1px 8px rgba(0,0,0,.07);cursor:pointer;
      transition:transform .15s,box-shadow .15s;
    }
    .mob-ev:active{transform:scale(.98);}
    .mob-ev:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.12);}
    .mob-stripe{width:4px;border-radius:4px;flex-shrink:0;}
    .mob-body{flex:1;min-width:0;}
    .mob-cat{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:4px;}
    .mob-title{font-size:15px;font-weight:800;color:var(--testo);margin-bottom:5px;line-height:1.3;}
    .mob-info{font-size:12px;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px;}
    .mob-time{display:inline-flex;align-items:center;gap:4px;}
    .mob-empty{text-align:center;padding:52px 20px;color:var(--sub);font-size:14px;}
    .mob-empty .ico{font-size:36px;margin-bottom:12px;}
    .mob-empty strong{display:block;font-size:15px;font-weight:700;color:var(--testo);margin-bottom:4px;}

    @media(max-width:480px){
      nav{height:56px;}
      .page{margin-top:56px;}
      .giorni-head{top:56px;}
      .day-strip{top:56px;}
    }
  </style>
</head>

<script>
  /* ── COSTANTI ── */
  const MESI_FULL = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
                     'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  const MESI_SHORT= ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  const GG_SHORT  = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
  const GG_FULL   = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];

  const SENIOR_KW = ['1 divisione','prima div','serie d','serie a','serie b','serie c'];

  const CAT = {
    allenamento:   { label:'Allenamento',  color:'#0d2055', cls:'ev-allenamento',  badge:'badge-a', mcls:'badge-a' },
    'fipav-senior':{ label:'FIPAV Senior', color:'#059669', cls:'ev-fipav-senior', badge:'badge-s', mcls:'badge-s' },
    'fipav-under': { label:'FIPAV Under',  color:'#7c3aed', cls:'ev-fipav-under',  badge:'badge-u', mcls:'badge-u' },
    opes:          { label:'OPES',         color:'#ea580c', cls:'ev-opes',         badge:'badge-o', mcls:'badge-o' },
    evento:        { label:'Evento',    color:'#e11d48', cls:'ev-evento',        badge:'badge-e', mcls:'badge-e' },
  };

  /* ── STATE ── */
  let oggi = new Date(); oggi.setHours(0,0,0,0);
  let weekStart = lunedi(oggi);   // lunedì della settimana corrente
  let mappa   = {};               // YYYY-MM-DD → [event, ...]
  let palestreMap = {};           // id → nome
  let filtroAtt = 'tutte';
  let selMobile = new Date(oggi); // giorno selezionato su mobile
  let loaded  = false;

  /* ── UTILITY ── */
  function lunedi(d) {
    const c = new Date(d); c.setHours(0,0,0,0);
    const dow = c.getDay();
    c.setDate(c.getDate() - (dow === 0 ? 6 : dow - 1));
    return c;
  }
  function addDays(d, n) { const c = new Date(d); c.setDate(c.getDate()+n); return c; }
  function dataKey(d) {
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function tsToKey(ts) {
    if (!ts) return null;
    const d = new Date(ts); return dataKey(d);
  }
  function parseOra(ora) {
    if (!ora) return {inizio:'—',fine:''};
    const sep = ora.includes('–')?'–':(ora.includes('-')?'-':null);
    if (sep){ const p=ora.split(sep); return {inizio:p[0].trim(),fine:p[1]?p[1].trim():''}; }
    return {inizio:ora.trim(),fine:''};
  }
  function oraDaTs(ts) {
    if (!ts) return '—';
    const d = new Date(ts);
    return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }
  function gruppoPartita(m) {
    if (m.fonte === 'opes') return 'opes';
    const cat = (m.categoria||'').toLowerCase();
    if (SENIOR_KW.some(k => cat.includes(k))) return 'fipav-senior';
    return 'fipav-under';
  }
  function isVirtus(n){ return /virtus caserta|virtus santa maria/i.test(n); }
  function avversario(m){
    if (isVirtus(m.casa) && !isVirtus(m.ospite)) return m.ospite;
    if (!isVirtus(m.casa) && isVirtus(m.ospite)) return m.casa;
    return m.casa+' – '+m.ospite;
  }
  function evVisible(e){ return filtroAtt==='tutte' || e.cat===filtroAtt; }

  /* ── FILTRI ── */
  let _noticeTimer = null;
  function setFiltro(cat, btn) {
    filtroAtt = cat;
    document.querySelectorAll('.fpill').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');

    const notice = document.getElementById('noticeAllenamenti');
    if (notice) {
      clearTimeout(_noticeTimer);
      if (cat === 'allenamento') {
        notice.classList.add('visible');
        _noticeTimer = setTimeout(() => notice.classList.remove('visible'), 3500);
      } else {
        notice.classList.remove('visible');
      }
    }

    render();
  }

  /* ── NAVIGAZIONE ── */
  function vaiOggi() { weekStart = lunedi(oggi); selMobile = new Date(oggi); render(); }

  document.getElementById('btnPrec').addEventListener('click', ()=>{ weekStart=addDays(weekStart,-7); render(); });
  document.getElementById('btnSucc').addEventListener('click', ()=>{ weekStart=addDays(weekStart, 7); render(); });

  /* ── RENDER PRINCIPALE ── */
  function render() {
    renderHeader();
    renderDesktop();
    renderMobile();
  }

  function renderHeader() {
    const fine = addDays(weekStart, 6);
    const sameMese = weekStart.getMonth()===fine.getMonth();
    const sameAnno = weekStart.getFullYear()===fine.getFullYear();
    let rangeStr;
    if (sameMese) {
      rangeStr = `${weekStart.getDate()} – ${fine.getDate()} ${MESI_SHORT[fine.getMonth()]} ${fine.getFullYear()}`;
    } else {
      rangeStr = `${weekStart.getDate()} ${MESI_SHORT[weekStart.getMonth()]}${!sameAnno?' '+weekStart.getFullYear():''} – ${fine.getDate()} ${MESI_SHORT[fine.getMonth()]} ${fine.getFullYear()}`;
    }
    document.getElementById('weekRange').innerHTML =
      `${rangeStr} <span>${MESI_FULL[weekStart.getMonth()]} ${weekStart.getFullYear()}</span>`;
  }

  /* ── RENDER DESKTOP (time grid 09–23) ── */
  const HOUR_H  = 60;   // px per hour
  const GRID_S  = 9;    // grid start (09:00)
  const GRID_E  = 23;   // grid end   (23:00)
  const GRID_TH = (GRID_E - GRID_S) * HOUR_H; // 840px total height

  function parseMin(str) {
    if (!str || str === '—') return null;
    const m = str.trim().match(/^(\d{1,2}):(\d{2})/);
    if (!m) return null;
    return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  }

  function renderDesktop() {
    const head = document.getElementById('giorniHead');
    const grid = document.getElementById('weekGrid');
    head.innerHTML = '';
    grid.innerHTML = '';

    // Header: 44px spacer + 7 day cells
    const spacer = document.createElement('div');
    spacer.className = 'gh-spacer';
    head.appendChild(spacer);

    for (let i = 0; i < 7; i++) {
      const d      = addDays(weekStart, i);
      const isOggi = dataKey(d) === dataKey(oggi);
      const isPast = d < oggi && !isOggi;
      const isDom  = d.getDay() === 0;
      const hc = document.createElement('div');
      hc.className = 'gh-cell'
        + (isOggi ? ' oggi'    : '')
        + (isDom  ? ' domenica': '')
        + (isPast ? ' passato' : '');
      hc.innerHTML = `<div class="gh-nome">${GG_SHORT[i]}</div><div class="gh-num">${d.getDate()}</div>`;
      head.appendChild(hc);
    }

    // Time gutter column
    const gutter = document.createElement('div');
    gutter.className = 'time-gutter';
    for (let h = GRID_S; h <= GRID_E; h++) {
      const lbl = document.createElement('div');
      lbl.className = 'time-lbl';
      lbl.style.top = ((h - GRID_S) * HOUR_H) + 'px';
      lbl.textContent = h + ':00';
      gutter.appendChild(lbl);
    }
    grid.appendChild(gutter);

    // Day columns
    for (let i = 0; i < 7; i++) {
      const d      = addDays(weekStart, i);
      const isOggi = dataKey(d) === dataKey(oggi);
      const isPast = d < oggi && !isOggi;
      const col = document.createElement('div');
      col.className = 'day-col'
        + (isOggi ? ' oggi-col'   : '')
        + (isPast ? ' passato-col': '');

      // Hour + half-hour grid lines
      for (let h = GRID_S; h <= GRID_E; h++) {
        const topPx = (h - GRID_S) * HOUR_H;
        const line = document.createElement('div');
        line.className = 'hour-line';
        line.style.top = topPx + 'px';
        col.appendChild(line);
        if (h < GRID_E) {
          const half = document.createElement('div');
          half.className = 'hour-line half';
          half.style.top = (topPx + HOUR_H / 2) + 'px';
          col.appendChild(half);
        }
      }

      // Current-time indicator (only for today)
      if (isOggi) {
        const now = new Date();
        const nowMin = now.getHours() * 60 + now.getMinutes();
        if (nowMin >= GRID_S * 60 && nowMin <= GRID_E * 60) {
          const nowLine = document.createElement('div');
          nowLine.className = 'now-line';
          nowLine.style.top = (nowMin - GRID_S * 60) + 'px';
          nowLine.innerHTML = '<div class="now-dot"></div>';
          col.appendChild(nowLine);
        }
      }

      const key    = dataKey(d);
      const eventi = (mappa[key] || []).filter(evVisible);
      const noTime = [];

      // Collect event positions for overlap detection
      const slots = []; // {start, end, el, left, pct}

      eventi.forEach(e => {
        const ci = CAT[e.cat] || CAT.allenamento;
        let startMin = null, endMin = null, timeStr = '', titleStr = '', subStr = '';

        if (e.tipo === 'allenamento' || e.tipo === 'evento') {
          const { inizio, fine } = parseOra(e.ora);
          startMin = parseMin(inizio);
          endMin   = parseMin(fine);
          timeStr  = inizio + (fine ? '–' + fine : '');
          titleStr = e.titolo || e.categoria || (e.tipo === 'evento' ? 'Evento' : 'Allenamento');
          subStr   = (e.palestra_id && palestreMap[e.palestra_id]) ? palestreMap[e.palestra_id] : '';
        } else {
          if (e.timestamp) {
            const dt = new Date(e.timestamp);
            startMin = dt.getHours() * 60 + dt.getMinutes();
            endMin   = startMin + 120;
            timeStr  = oraDaTs(e.timestamp);
          }
          titleStr = 'vs ' + avversario(e);
          subStr   = e.categoria || '';
        }

        if (startMin === null) { noTime.push(e); return; }

        const clampStart = Math.max(startMin, GRID_S * 60);
        const clampEnd   = Math.min(endMin || startMin + 60, GRID_E * 60);
        if (clampEnd <= clampStart) { noTime.push(e); return; }

        const top    = clampStart - GRID_S * 60;
        const height = Math.max(clampEnd - clampStart, 28);

        // Overlap: find concurrent slots
        const overlapping = slots.filter(s => s.end > clampStart && s.start < clampEnd);
        const colIdx = overlapping.length;
        const total  = colIdx + 1;

        // Recalculate width of all concurrent events
        slots.push({ start: clampStart, end: clampEnd, el: null, colIdx, total });
        const slotRef = slots[slots.length - 1];

        // Build element
        const el = document.createElement('div');
        el.className = `ev ${ci.cls}`;
        el.style.top    = top + 'px';
        el.style.height = height + 'px';
        el.addEventListener('click', () => apriDetail(e));

        const showSub   = height >= 46;
        const showBadge = height >= 58;
        el.innerHTML = `<div class="ev-time">${timeStr || '—'}</div>
          <div class="ev-title">${titleStr}</div>
          ${showSub && subStr ? `<div class="ev-sub">${subStr}</div>` : ''}
          ${showBadge ? `<span class="ev-badge ${ci.badge}">${ci.label}</span>` : ''}`;

        col.appendChild(el);
        slotRef.el = el;

        // Update widths/lefts for all overlapping group
        const group = slots.filter(s => s.end > clampStart && s.start < clampEnd);
        const n = group.length;
        const pct = 100 / n;
        group.forEach((s, idx) => {
          if (s.el) {
            s.el.style.left  = (idx * pct) + '%';
            s.el.style.right = 'auto';
            s.el.style.width = 'calc(' + pct + '% - 4px)';
          }
        });
      });

      // No-time events: compact chips at very top
      if (noTime.length) {
        const strip = document.createElement('div');
        strip.className = 'no-time-strip';
        noTime.forEach(e => {
          const ci = CAT[e.cat] || CAT.allenamento;
          const title = (e.tipo === 'allenamento' || e.tipo === 'evento')
            ? (e.titolo || 'Allenamento')
            : 'vs ' + avversario(e);
          const chip = document.createElement('div');
          chip.className = `ev-chip ${ci.cls}`;
          chip.style.borderLeftColor = ci.color;
          chip.style.background = `rgba(${ci.color === '#0d2055' ? '13,32,85' : ci.color === '#059669' ? '5,150,105' : ci.color === '#7c3aed' ? '124,58,237' : '234,88,12'},.07)`;
          chip.textContent = title;
          chip.addEventListener('click', () => apriDetail(e));
          strip.appendChild(chip);
        });
        col.appendChild(strip);
      }

      grid.appendChild(col);
    }
  }

  /* ── RENDER MOBILE ── */
  function renderMobile() {
    const strip  = document.getElementById('dayStrip');
    const events = document.getElementById('mobileEvents');
    strip.innerHTML = '';

    for (let i=0; i<7; i++) {
      const d = addDays(weekStart, i);
      const key     = dataKey(d);
      const isOggi  = dataKey(d)===dataKey(oggi);
      const isSel   = dataKey(d)===dataKey(selMobile);
      const isPast  = d < oggi && !isOggi;
      const isDom   = d.getDay()===0;
      const evList  = (mappa[key]||[]).filter(evVisible);
      const cats    = [...new Set(evList.map(e=>e.cat))].slice(0,3);

      const cell = document.createElement('div');
      cell.className = 'ds-cell'
        + (isSel?' selected':'')
        + (isOggi?' oggi-strip':'')
        + (isDom?' domenica-strip':'')
        + (isPast?' passato-strip':'');

      cell.innerHTML = `<div class="ds-nome">${GG_SHORT[i]}</div>
        <div class="ds-num">${d.getDate()}</div>
        <div class="ds-dots">${cats.map(c=>`<div class="ds-dot" style="background:${CAT[c]?.color||'#999'}"></div>`).join('')}</div>`;
      cell.addEventListener('click', ()=>{ selMobile=new Date(d); renderMobile(); });
      strip.appendChild(cell);
    }

    // Scroll selected into view
    const selEl = strip.querySelector('.selected');
    if (selEl) selEl.scrollIntoView({inline:'center',block:'nearest'});

    // Events for selected day
    const key    = dataKey(selMobile);
    const evList = (mappa[key]||[]).filter(evVisible);
    const dow    = GG_FULL[(selMobile.getDay()+6)%7];
    const dateLabel = `${dow}, ${selMobile.getDate()} ${MESI_SHORT[selMobile.getMonth()]} ${selMobile.getFullYear()}`;

    if (!evList.length) {
      events.innerHTML = `<div class="mob-empty">
        <div style="font-weight:700;color:var(--testo);margin-bottom:4px;">${dateLabel}</div>
        <div>${filtroAtt==='tutte'?'Nessun evento programmato.':'Nessun evento di questa categoria.'}</div>
      </div>`;
      return;
    }

    events.innerHTML = `<div style="font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">${dateLabel}</div>`
      + evList.map(e=>{
          const ci = CAT[e.cat]||CAT.allenamento;
          let timeStr, titleStr, subStr='';
          if (e.tipo==='allenamento' || e.tipo==='evento'){
            const {inizio,fine}=parseOra(e.ora);
            timeStr=inizio+(fine?' – '+fine:'');
            titleStr=e.titolo||e.categoria||(e.tipo==='evento'?'Evento':'Allenamento');
            const _pn=e.palestra_id&&palestreMap[e.palestra_id]?palestreMap[e.palestra_id]:'';
            subStr=_pn+(e.note?(_pn?' · ':'')+e.note:'');
          } else {
            timeStr=e.timestamp?oraDaTs(e.timestamp):'—';
            titleStr='vs '+avversario(e);
            subStr=(e.luogo?'Dove:'+e.luogo:'');
            if(e.played&&e.risultato) subStr+=(subStr?' · ':'')+'Risultato: '+e.risultato;
          }
          return `<div class="mob-ev" onclick='apriDetail(${JSON.stringify(e).replace(/'/g,"&#39;")})'>
            <div class="mob-stripe" style="background:${ci.color}"></div>
            <div class="mob-body">
              <div class="mob-cat" style="color:${ci.color}">${ci.label}</div>
              <div class="mob-title">${titleStr}</div>
              <div class="mob-info">
                <span>Ore: ${timeStr}</span>
                ${subStr?`<span>${subStr}</span>`:''}
              </div>
            </div>
          </div>`;
        }).join('');
  }

  /* ── MODAL DETTAGLIO ── */
  function apriDetail(e) {
    const ci = CAT[e.cat]||CAT.allenamento;
    const tag    = document.getElementById('dmTag');
    const title  = document.getElementById('dmTitle');
    const body   = document.getElementById('dmBody');
    const accent = document.getElementById('dmAccent');

    tag.textContent      = ci.label;
    tag.style.background = ci.color;
    accent.style.background = ci.color;

    let photoHtml = '';
    let fields = [];

    if (e.tipo==='allenamento' || e.tipo==='evento') {
      title.textContent = e.titolo || e.categoria || (e.tipo==='evento' ? 'Evento' : 'Allenamento');
      if (e.foto) photoHtml = `<img class="dm-photo" src="${e.foto}" loading="lazy">`;
      if (e.categoria) fields.push({lbl:'Categoria', val: e.categoria});
      const {inizio,fine}=parseOra(e.ora);
      fields.push({lbl:'Orario', val: fine?`${inizio} – ${fine}`:inizio});
      if (e.palestra_id && palestreMap[e.palestra_id]) fields.push({lbl:'Palestra', val: palestreMap[e.palestra_id]});
      if (e.note)  fields.push({lbl:'Note', val: e.note});
    } else {
      title.innerHTML = `<span style="font-weight:400;font-size:14px;color:var(--sub)">vs</span><br>${avversario(e)}`;
      if (e.categoria) fields.push({lbl:'Categoria', val: e.categoria});
      const ora = e.timestamp ? oraDaTs(e.timestamp) : '—';
      fields.push({lbl:'Orario', val: ora});
      fields.push({lbl:'Squadre', val: `<strong>${e.casa}</strong> vs <strong>${e.ospite}</strong>`});
      if (e.luogo) fields.push({lbl:'Luogo', val: e.luogo});
      if (e.played && e.risultato) {
        const parc = e.parziali&&e.parziali.length ? ` <span style="font-size:12px;color:var(--sub)">(${e.parziali.join(', ')})</span>` : '';
        fields.push({lbl:'Risultato', val: `<strong>${e.risultato}</strong>${parc}`});
      } else if (e.postponed) {
        fields.push({lbl:'Stato', val: '<span class="dm-val-badge rinviata">Partita rinviata</span>'});
      } else {
        fields.push({lbl:'Stato', val: '<span class="dm-val-badge">Da giocare</span>'});
      }
    }

    const infoHtml = fields.map(f=>`
      <div class="dm-field">
        <div class="dm-lbl">${f.lbl}</div>
        <div class="dm-val">${f.val}</div>
      </div>`).join('');

    body.innerHTML = photoHtml + `<div class="dm-info">${infoHtml}</div>`;

    if ((e.tipo === 'allenamento' || e.tipo === 'evento') && e.id) {
      const rsvpDiv = document.createElement('div');
      rsvpDiv.id = 'rsvpSection';
      rsvpDiv.className = 'dm-rsvp';
      rsvpDiv.innerHTML = '<div class="dm-rsvp-lbl">La tua partecipazione</div><div style="font-size:13px;color:#9ca3af;">Caricamento...</div>';
      body.appendChild(rsvpDiv);
      fetch(`/api/calendario/${e.id}/mia-risposta`)
        .then(r => r.ok ? r.json() : null)
        .then(d => { if (document.getElementById('rsvpSection')) { if (d) _renderRsvp(rsvpDiv, e.id, d.risposta); else rsvpDiv.innerHTML = ''; } })
        .catch(() => { if (document.getElementById('rsvpSection')) rsvpDiv.innerHTML = ''; });
    }

    document.getElementById('detailModal').classList.add('open');
  }

  function _renderRsvp(container, sessioneId, risposta) {
    container.innerHTML = `
      <div class="dm-rsvp-lbl">La tua partecipazione</div>
      <div class="rsvp-grid">
        <button class="rsvp-card si${risposta==='si'?' active':''}" onclick="submitRsvp('${sessioneId}','si')">
          <span class="rsvp-dot"></span>Partecipo
        </button>
        <button class="rsvp-card no${risposta==='no'?' active':''}" onclick="submitRsvp('${sessioneId}','no')">
          <span class="rsvp-dot"></span>Non partecipo
        </button>
      </div>`;
  }

  window.submitRsvp = async function(sessioneId, risposta) {
    try {
      const r = await fetch(`/api/calendario/${sessioneId}/partecipa`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ risposta })
      });
      const data = await r.json();
      if (r.ok) {
        const c = document.getElementById('rsvpSection');
        if (c) _renderRsvp(c, sessioneId, data.risposta);
      }
    } catch {}
  };

  function chiudiDetail(e) {
    if (!e || e.target===document.getElementById('detailModal'))
      document.getElementById('detailModal').classList.remove('open');
  }

  /* ── MODAL ADD (admin) ── */
  function setMTipo(tipo) {
    document.getElementById('mTipo').value = tipo;
    document.getElementById('addModalTitolo').textContent = tipo === 'evento' ? 'Nuovo evento' : 'Nuovo allenamento';
    const on  = 'flex:1;padding:9px 6px;border-radius:8px;border:2px solid;font-size:12px;font-weight:700;cursor:pointer;';
    const btnA = document.getElementById('mTipoAllenamento');
    const btnE = document.getElementById('mTipoEvento');
    if (tipo === 'evento') {
      btnE.style.cssText = on + 'border-color:#e11d48;background:#e11d48;color:#fff;';
      btnA.style.cssText = on + 'border-color:#d1d5db;background:#fff;color:#374151;';
    } else {
      btnA.style.cssText = on + 'border-color:#0d2055;background:#0d2055;color:#fff;';
      btnE.style.cssText = on + 'border-color:#d1d5db;background:#fff;color:#374151;';
    }
  }

  function apriAddModal() {
    const d = new Date().toISOString().slice(0,10);
    document.getElementById('mTitolo').value='';
    document.getElementById('mData').value=dataKey(selMobile)||d;
    document.getElementById('mInizio').value='18:00';
    document.getElementById('mFine').value='20:00';
    document.getElementById('mCategoria').value='';
    document.getElementById('mFoto').value='';
    document.getElementById('mNote').value='';
    setMTipo('allenamento');
    document.getElementById('addModal').classList.add('open');
  }
  function chiudiAddModal(e) {
    if (!e||e.target===document.getElementById('addModal'))
      document.getElementById('addModal').classList.remove('open');
  }

  async function salva() {
    const titolo=document.getElementById('mTitolo').value.trim();
    const data=document.getElementById('mData').value;
    const inizio=document.getElementById('mInizio').value;
    const fine=document.getElementById('mFine').value;
    if (!titolo||!data||!inizio){alert('Titolo, data e orario di inizio obbligatori.');return;}
    const ora=fine?`${inizio}–${fine}`:inizio;
    const btn=document.getElementById('btnSalva');
    btn.disabled=true;btn.textContent='Salvataggio…';
    try {
      const tipo=document.getElementById('mTipo').value;
      const foto=document.getElementById('mFoto').value.trim();
      const res=await fetch('/api/calendario',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({titolo,data,ora,tipo,foto,
          categoria:document.getElementById('mCategoria').value,
          note:document.getElementById('mNote').value.trim()})});
      if (!res.ok) throw new Error('Errore server');
      const n=await res.json();
      if (!mappa[n.data]) mappa[n.data]=[];
      const cat = n.tipo==='evento' ? 'evento' : 'allenamento';
      mappa[n.data].push({tipo:n.tipo||'allenamento',cat,...n});
      chiudiAddModal();
      selMobile=new Date(n.data+'T00:00:00');
      weekStart=lunedi(selMobile);
      render();
    } catch(err){alert('Errore: '+err.message);}
    finally{btn.disabled=false;btn.textContent='Aggiungi';}
  }

  /* ── FAB visibilità ── */
  fetch('/api/me').then(r=>r.json()).then(d=>{
    if(d.auth&&(d.role==='admin'||d.role==='dirigente')) document.getElementById('fabAggiungi').style.display='flex';
  }).catch(()=>{});

  /* ── CARICA DATI ── */
  async function carica() {
    render(); // mostra UI subito

    try {
      const pals = await fetch('/api/palestre').then(r=>r.json());
      pals.forEach(p => { palestreMap[p.id] = p.nome; });
    } catch(e){console.warn('[Palestre]',e.message);}

    try {
      const sessioni=await fetch('/api/calendario').then(r=>r.json());
      sessioni.forEach(s=>{
        if (!s.data) return;
        if (!mappa[s.data]) mappa[s.data]=[];
        const cat = s.tipo === 'evento' ? 'evento' : 'allenamento';
        mappa[s.data].push({tipo: s.tipo||'allenamento', cat, ...s});
      });
    } catch(e){console.warn('[Calendario]',e.message);}

    try {
      const resp=await fetch('/api/partite/tutte').then(r=>r.json());
      Object.values(resp.gruppi||{}).forEach(g=>{
        (g.partite||[]).forEach(m=>{
          if (!m.timestamp) return;
          const key=tsToKey(m.timestamp);
          if (!key) return;
          if (!mappa[key]) mappa[key]=[];
          const cat=gruppoPartita(m);
          mappa[key].push({tipo:'partita',cat,...m});
        });
      });
    } catch(e){console.warn('[Partite]',e.message);}

    render();
  }

  // Jump to date from URL hash (e.g. /calendario#2026-05-15)
  (function () {
    const hash = location.hash.slice(1);
    if (/^\d{4}-\d{2}-\d{2}$/.test(hash)) {
      const target = new Date(hash + 'T00:00:00');
      if (!isNaN(target)) {
        weekStart = lunedi(target);
        selMobile = new Date(target);
      }
    }
  })();

  carica();

  /* ── SYNC scroll orizzontale header ↔ griglia ── */
  document.getElementById('calScrollWrap').addEventListener('scroll', function() {
    document.getElementById('giorniHead').scrollLeft = this.scrollLeft;
  });

  /* ── Auto-scroll to current time on desktop ── */
  function scrollToNow() {
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();
    if (nowMin < GRID_S * 60 || nowMin > GRID_E * 60) return;
    const topPx = nowMin - GRID_S * 60; // 1px = 1min
    const offset = Math.max(0, topPx - 120); // show 2h before now
    window.scrollTo({ top: document.getElementById('giorniHead').getBoundingClientRect().bottom + window.scrollY + offset, behavior: 'smooth' });
  }
  // Scroll to now after initial data load
  setTimeout(scrollToNow, 800);
</script>
<script src="common.js"></script>
</body>
</html>
