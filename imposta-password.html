<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imposta password – Virtus Caserta</title>
  <meta name="robots" content="noindex">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0d2055;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 36px 32px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    .logo-wrap { text-align: center; margin-bottom: 24px; }
    .logo { height: 60px; }
    .panel-title { font-size: 17px; font-weight: 800; color: #0d2055; margin-bottom: 4px; }
    .panel-sub   { font-size: 13px; color: #8e8e93; margin-bottom: 20px; }
    .field { margin-bottom: 12px; text-align: left; }
    .field label {
      display: block; font-size: 11px; font-weight: 700;
      color: #8e8e93; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 4px;
    }
    .field input {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid #e5e5ea; border-radius: 10px;
      font-size: 14px; outline: none; transition: border-color .2s;
    }
    .field input:focus { border-color: #0d2055; }
    .submit-btn {
      width: 100%; padding: 13px;
      background: #0d2055; color: #fff;
      border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700;
      cursor: pointer; transition: background .2s; margin-top: 8px;
    }
    .submit-btn:hover { background: #1535a8; }
    .submit-btn:disabled { opacity: .5; cursor: not-allowed; }
    .error   { color: #dc2626; font-size: 13px; margin-top: 10px; min-height: 18px; }
    .success { color: #16a34a; font-size: 13px; margin-top: 10px; }
    .hint    { font-size: 12px; color: #8e8e93; margin-top: 6px; }
    .stato-box {
      text-align: center; padding: 20px 0;
      font-size: 15px; color: #374151; line-height: 1.6;
    }
    .stato-box .icon { font-size: 44px; margin-bottom: 12px; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <img class="logo" src="images/positivo@4x.png" alt="Virtus Caserta" onerror="this.style.display='none'">
  </div>

  <div id="loading" class="stato-box">
    <div class="icon">⏳</div>
    <div>Verifica del link in corso...</div>
  </div>

  <div id="formBox" style="display:none;">
    <div class="panel-title">Imposta la tua password</div>
    <div class="panel-sub" id="benvenuto">Scegli una password sicura per il tuo account.</div>
    <form onsubmit="impostaPassword(event)">
      <div class="field">
        <label for="pass">Password</label>
        <input type="password" id="pass" placeholder="Minimo 6 caratteri" required />
      </div>
      <div class="field">
        <label for="passC">Conferma Password</label>
        <input type="password" id="passC" placeholder="Ripeti la password" required />
      </div>
      <div class="hint">La password deve essere lunga almeno 6 caratteri.</div>
      <button type="submit" class="submit-btn" id="btnConferma">Conferma e accedi</button>
    </form>
    <div class="error" id="errMsg"></div>
  </div>

  <div id="errBox" style="display:none;" class="stato-box">
    <div class="icon">❌</div>
    <div id="errBoxMsg">Link non valido o scaduto.</div>
    <div style="margin-top:16px;font-size:13px;color:#8e8e93;">Contatta <a href="mailto:virtuscaserta@gmail.com" style="color:#f57c00">virtuscaserta@gmail.com</a> per assistenza.</div>
  </div>

  <div id="okBox" style="display:none;" class="stato-box">
    <div class="icon">✅</div>
    <div><strong>Password impostata!</strong><br>Il tuo account è ora attivo.</div>
    <div style="margin-top:20px;">
      <a href="/login" style="display:inline-block;background:#0d2055;color:#fff;text-decoration:none;padding:12px 28px;border-radius:10px;font-size:14px;font-weight:700;">Accedi ora</a>
    </div>
  </div>
</div>

<script>
  const token = new URLSearchParams(location.search).get('token');

  async function init() {
    if (!token) { showErr('Link non valido. Richiedi un nuovo link al tuo amministratore.'); return; }
    try {
      const r = await fetch(`/api/imposta-password/verifica?token=${encodeURIComponent(token)}`);
      const d = await r.json();
      if (!r.ok) { showErr(d.error || 'Link non valido o scaduto.'); return; }
      document.getElementById('benvenuto').textContent = `Ciao ${d.nome}! Scegli una password per il tuo account (${d.email}).`;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('formBox').style.display = 'block';
    } catch {
      showErr('Errore di rete. Riprova più tardi.');
    }
  }

  function showErr(msg) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('errBoxMsg').textContent = msg;
    document.getElementById('errBox').style.display = 'block';
  }

  async function impostaPassword(e) {
    e.preventDefault();
    const errEl = document.getElementById('errMsg');
    const pass  = document.getElementById('pass').value;
    const passC = document.getElementById('passC').value;
    errEl.textContent = '';
    if (pass !== passC)    { errEl.textContent = 'Le password non coincidono.'; return; }
    if (pass.length < 6)   { errEl.textContent = 'Password minimo 6 caratteri.'; return; }
    const btn = document.getElementById('btnConferma');
    btn.disabled = true; btn.textContent = 'Attendi...';
    try {
      const r = await fetch('/api/imposta-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: pass }),
      });
      const d = await r.json();
      if (!r.ok) { errEl.textContent = d.error || 'Errore. Riprova.'; btn.disabled = false; btn.textContent = 'Conferma e accedi'; return; }
      document.getElementById('formBox').style.display = 'none';
      document.getElementById('okBox').style.display = 'block';
    } catch {
      errEl.textContent = 'Errore di rete. Riprova.';
      btn.disabled = false; btn.textContent = 'Conferma e accedi';
    }
  }

  init();
</script>
</body>
</html>
