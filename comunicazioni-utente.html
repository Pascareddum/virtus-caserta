<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comunicazioni – Virtus Caserta</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body{font-family:'Segoe UI',Arial,sans-serif;background:#f7f8fa;min-height:100vh;display:flex;flex-direction:column;}
    .page-wrap{flex:1;max-width:680px;width:100%;margin:0 auto;padding:32px 20px 64px;}
    .top-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:28px;}
    .top-left{display:flex;align-items:center;gap:14px;}
    .btn-back{display:inline-flex;align-items:center;gap:6px;color:#0d2055;text-decoration:none;
      font-size:13px;font-weight:700;padding:8px 14px;border-radius:10px;border:1.5px solid #e9ecf0;
      background:#fff;transition:all .2s;}
    .btn-back:hover{border-color:#0d2055;background:#eef4ff;}
    .page-title{font-size:20px;font-weight:800;color:#0d2055;letter-spacing:-.02em;}
    .btn-compose{display:inline-flex;align-items:center;gap:7px;background:#0d2055;color:#fff;
      padding:9px 18px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;
      font-family:inherit;transition:background .2s;}
    .btn-compose:hover{background:#1535a8;}

    /* ── Tabs ── */
    .tabs{display:flex;gap:0;background:#fff;border-radius:14px;border:1.5px solid #e9ecf0;
      overflow:hidden;margin-bottom:16px;box-shadow:0 2px 12px rgba(13,32,85,.04);}
    .tab{flex:1;padding:12px 8px;text-align:center;font-size:13px;font-weight:700;color:#6b7280;
      cursor:pointer;border:none;background:none;font-family:inherit;transition:all .15s;position:relative;}
    .tab.active{color:#0d2055;background:#eef4ff;}
    .tab .unread-badge{position:absolute;top:8px;right:calc(50% - 22px);
      background:#dc2626;color:#fff;font-size:9px;font-weight:800;
      min-width:16px;height:16px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;}

    /* ── Message list ── */
    .msgs-section{background:#fff;border-radius:18px;border:1.5px solid #e9ecf0;overflow:hidden;
      box-shadow:0 2px 16px rgba(13,32,85,.05);}
    .msg-item{display:flex;gap:14px;padding:16px 20px;border-bottom:1px solid #f1f5f9;
      cursor:pointer;transition:background .12s;position:relative;}
    .msg-item:last-child{border-bottom:none;}
    .msg-item:hover{background:#f9fafb;}
    .msg-item.unread{background:#fafcff;}
    .msg-item.unread::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#0d2055;border-radius:0 2px 2px 0;}
    .msg-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(140deg,#0d2055,#1e4bd8);
      display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex-shrink:0;}
    .msg-body{flex:1;min-width:0;}
    .msg-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px;}
    .msg-from{font-size:14px;font-weight:700;color:#111827;}
    .msg-item.unread .msg-from{font-weight:800;}
    .msg-date{font-size:11px;color:#9ca3af;white-space:nowrap;}
    .msg-subject{font-size:13px;font-weight:600;color:#374151;margin-bottom:3px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .msg-preview{font-size:12px;color:#9ca3af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .msg-item.unread .msg-subject{color:#0d2055;}
    .msg-empty{padding:48px 20px;text-align:center;color:#9ca3af;font-size:13px;font-weight:600;}
    .msgs-loading{padding:28px;text-align:center;color:#9ca3af;}
    .spin{display:inline-block;width:18px;height:18px;border:2.5px solid #e2e8f0;border-top-color:#0d2055;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* ── Detail panel ── */
    .modal-bg{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.45);
      backdrop-filter:blur(6px);align-items:flex-end;justify-content:center;padding:0;}
    .modal-bg.open{display:flex;}
    .modal-sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:680px;
      max-height:85vh;overflow-y:auto;padding:0 0 32px;
      box-shadow:0 -8px 40px rgba(0,0,0,.15);}
    .sheet-handle{width:36px;height:4px;background:#e5e7eb;border-radius:2px;margin:12px auto 0;}
    .sheet-hdr{padding:20px 24px 16px;border-bottom:1px solid #f1f5f9;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
    .sheet-subject{font-size:18px;font-weight:800;color:#111827;line-height:1.3;flex:1;}
    .sheet-close{width:30px;height:30px;border-radius:50%;border:none;background:#f1f5f9;color:#6b7280;
      font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;}
    .sheet-close:hover{background:#e2e8f0;}
    .sheet-meta{padding:14px 24px;background:#f9fafb;border-bottom:1px solid #f1f5f9;font-size:12px;color:#6b7280;}
    .sheet-meta strong{color:#374151;}
    .sheet-body{padding:20px 24px;font-size:14px;color:#374151;line-height:1.7;white-space:pre-wrap;}

    /* ── Compose modal ── */
    .compose-bg{display:none;position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.45);
      backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:20px;}
    .compose-bg.open{display:flex;}
    .compose-box{background:#fff;border-radius:20px;padding:26px 24px;width:100%;max-width:480px;
      box-shadow:0 24px 64px rgba(0,0,0,.25);}
    .compose-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
    .compose-hdr h3{font-size:17px;font-weight:800;color:#111827;}
    .cfield{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
    .cfield label{font-size:11px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.7px;}
    .cfield input,.cfield select,.cfield textarea{
      padding:10px 13px;border:1.5px solid #e9ecf0;border-radius:10px;
      font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;width:100%;}
    .cfield input:focus,.cfield select:focus,.cfield textarea:focus{border-color:#0d2055;}
    .cfield textarea{resize:vertical;min-height:100px;}
    .compose-ftr{display:flex;gap:10px;margin-top:4px;}
    .btn-cancel{flex:1;padding:12px;border:1.5px solid #e9ecf0;background:none;border-radius:50px;
      font-size:14px;font-weight:600;cursor:pointer;color:#6b7280;font-family:inherit;transition:background .2s;}
    .btn-cancel:hover{background:#f9fafb;}
    .btn-send{flex:2;padding:12px;border:none;background:#0d2055;color:#fff;border-radius:50px;
      font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .2s;}
    .btn-send:hover{opacity:.88;}
    .btn-send:disabled{opacity:.5;cursor:not-allowed;}

    @media(max-width:480px){.page-wrap{padding:20px 14px 48px;}.modal-sheet{border-radius:18px 18px 0 0;}.sheet-hdr{padding:16px 18px;}.sheet-body{padding:16px 18px;}.sheet-meta{padding:12px 18px;}}
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="top-bar">
      <div class="top-left">
        <a href="/utente" class="btn-back">← Account</a>
        <h1 class="page-title">Comunicazioni</h1>
      </div>
      <button class="btn-compose" onclick="apriCompose()">✉ Scrivi</button>
    </div>

    <div class="tabs">
      <button class="tab active" id="tabRicevute" onclick="switchTab('ricevute')">
        Ricevute <span class="unread-badge" id="unreadBadge" style="display:none"></span>
      </button>
      <button class="tab" id="tabInviate" onclick="switchTab('inviate')">Inviate</button>
    </div>

    <div class="msgs-section">
      <div class="msgs-list" id="msgsList">
        <div class="msgs-loading"><div class="spin"></div> Caricamento…</div>
      </div>
    </div>
  </div>

  <!-- Detail sheet -->
  <div class="modal-bg" id="detailModal" onclick="chiudiDetail(event)">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-hdr">
        <div class="sheet-subject" id="sheetSubject"></div>
        <button class="sheet-close" onclick="chiudiDetail()">✕</button>
      </div>
      <div class="sheet-meta" id="sheetMeta"></div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <!-- Compose modal -->
  <div class="compose-bg" id="composeModal" onclick="chiudiCompose(event)">
    <div class="compose-box">
      <div class="compose-hdr">
        <h3>Nuova comunicazione</h3>
        <button class="sheet-close" onclick="chiudiCompose()">✕</button>
      </div>
      <div class="cfield">
        <label>Destinatario</label>
        <select id="cDest">
          <option value="staff">Staff / Allenatori</option>
          <option value="admin">Amministrazione</option>
          <option value="dirigenza">Dirigenza</option>
        </select>
      </div>
      <div class="cfield"><label>Oggetto</label><input type="text" id="cOggetto" placeholder="Es. Richiesta info allenamento"></div>
      <div class="cfield"><label>Messaggio</label><textarea id="cMessaggio" placeholder="Scrivi il tuo messaggio…"></textarea></div>
      <div class="compose-ftr">
        <button class="btn-cancel" onclick="chiudiCompose()">Annulla</button>
        <button class="btn-send" id="btnSend" onclick="inviaMsg()">Invia</button>
      </div>
    </div>
  </div>

  <script>
    const _tok = localStorage.getItem('vc_token');
    if (!_tok && !localStorage.getItem('vc_admin_token')) { location.replace('/login'); }

    let curTab = 'ricevute';
    let msgs = [];

    function switchTab(tab) {
      curTab = tab;
      document.getElementById('tabRicevute').classList.toggle('active', tab === 'ricevute');
      document.getElementById('tabInviate').classList.toggle('active', tab === 'inviate');
      renderList();
    }

    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const oggi = new Date(); oggi.setHours(0,0,0,0);
      const dData = new Date(d); dData.setHours(0,0,0,0);
      if (dData.getTime() === oggi.getTime()) return d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
      return d.toLocaleDateString('it-IT', { day: '2-digit', month: 'short' });
    }

    function initials(str) {
      return (str || 'VC').split(' ').map(s => s[0]).join('').toUpperCase().slice(0, 2);
    }

    function renderList() {
      const list = document.getElementById('msgsList');
      const filtered = msgs.filter(m => curTab === 'ricevute' ? !m.inviata : m.inviata);
      const unread = msgs.filter(m => !m.inviata && !m.letto).length;
      const badge = document.getElementById('unreadBadge');
      if (unread > 0) { badge.style.display = ''; badge.textContent = unread; }
      else { badge.style.display = 'none'; }

      if (!filtered.length) {
        list.innerHTML = `<div class="msg-empty">${curTab === 'ricevute' ? 'Nessuna comunicazione ricevuta' : 'Nessun messaggio inviato'}</div>`;
        return;
      }
      list.innerHTML = '';
      filtered.forEach(m => {
        const item = document.createElement('div');
        item.className = 'msg-item' + (!m.letto && !m.inviata ? ' unread' : '');
        const name = m.inviata ? (m.destinatario || 'Staff') : (m.mittente || 'Virtus Caserta');
        item.innerHTML = `
          <div class="msg-avatar">${initials(name)}</div>
          <div class="msg-body">
            <div class="msg-top">
              <span class="msg-from">${name}</span>
              <span class="msg-date">${fmtDate(m.creato_il || m.data)}</span>
            </div>
            <div class="msg-subject">${m.oggetto || '(senza oggetto)'}</div>
            <div class="msg-preview">${(m.testo || m.messaggio || '').slice(0, 80)}</div>
          </div>`;
        item.addEventListener('click', () => apriDetail(m));
        list.appendChild(item);
      });
    }

    function apriDetail(m) {
      const name = m.inviata ? (m.destinatario || 'Staff') : (m.mittente || 'Virtus Caserta');
      document.getElementById('sheetSubject').textContent = m.oggetto || '(senza oggetto)';
      document.getElementById('sheetMeta').innerHTML = `<strong>${m.inviata ? 'A:' : 'Da:'}</strong> ${name} &nbsp;·&nbsp; ${new Date(m.creato_il||m.data).toLocaleString('it-IT',{dateStyle:'medium',timeStyle:'short'})}`;
      document.getElementById('sheetBody').textContent = m.testo || m.messaggio || '';
      document.getElementById('detailModal').classList.add('open');
      // Mark as read
      if (!m.letto && !m.inviata && m.id && _tok) {
        fetch(`/api/comunicazioni/${m.id}/leggi`, { method: 'POST', headers: { Authorization: `Bearer ${_tok}` } }).catch(() => {});
        m.letto = true;
        renderList();
      }
    }
    function chiudiDetail(e) {
      if (!e || e.target === document.getElementById('detailModal'))
        document.getElementById('detailModal').classList.remove('open');
    }

    function apriCompose() { document.getElementById('composeModal').classList.add('open'); }
    function chiudiCompose(e) {
      if (!e || e.target === document.getElementById('composeModal'))
        document.getElementById('composeModal').classList.remove('open');
    }

    async function inviaMsg() {
      const ogg = document.getElementById('cOggetto').value.trim();
      const testo = document.getElementById('cMessaggio').value.trim();
      const dest = document.getElementById('cDest').value;
      if (!ogg || !testo) { alert('Oggetto e messaggio obbligatori'); return; }
      const btn = document.getElementById('btnSend');
      btn.disabled = true; btn.textContent = 'Invio…';
      try {
        const r = await fetch('/api/comunicazioni', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_tok}` },
          body: JSON.stringify({ oggetto: ogg, testo, destinatario: dest })
        });
        if (!r.ok) throw new Error('Errore ' + r.status);
        const nm = await r.json();
        msgs.unshift({ ...nm, inviata: true });
        chiudiCompose();
        document.getElementById('cOggetto').value = '';
        document.getElementById('cMessaggio').value = '';
        switchTab('inviate');
      } catch (e) {
        alert('Errore durante l\'invio: ' + e.message);
      } finally {
        btn.disabled = false; btn.textContent = 'Invia';
      }
    }

    async function carica() {
      try {
        const r = await fetch('/api/comunicazioni', { headers: { Authorization: `Bearer ${_tok}` } });
        if (!r.ok) throw new Error();
        msgs = await r.json();
      } catch {
        msgs = [];
      }
      renderList();
    }
    carica();
  </script>
</body>
</html>
