<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Il mio account – Virtus Caserta</title>
  <link rel="stylesheet" href="common.css">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f7f8fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .profile-wrap {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 24px 64px;
    }
    .profile-card {
      background: #fff;
      border-radius: 24px;
      padding: 44px 40px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 40px rgba(13,32,85,.07);
      border: 1px solid #e9ecf0;
    }
    .profile-logo { height: 48px; margin-bottom: 28px; }

    /* ── Avatar ── */
    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(140deg, #0d2055 0%, #1e4bd8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      font-size: 30px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
      box-shadow: 0 4px 16px rgba(13,32,85,.25);
    }
    .profile-name {
      font-size: 24px;
      font-weight: 800;
      color: #0d2055;
      letter-spacing: -.025em;
      margin-bottom: 14px;
    }

    /* ── Roles ── */
    .profile-roles {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 28px;
      min-height: 0;
    }
    .role-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0;
      max-width: 100%;
    }
    .role-pill .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .role-pill .pill-tipo {
      font-weight: 800;
      margin-right: 2px;
    }
    .role-atleta {
      background: #eef4ff;
      color: #1d4ed8;
    }
    .role-atleta .pill-dot { background: #3b82f6; }
    .role-allenatore {
      background: #fff7ed;
      color: #c2410c;
    }
    .role-allenatore .pill-dot { background: #f97316; }

    /* ── Impegni settimana ── */
    .agenda-section {
      margin-bottom: 32px;
      background: #f8fafc;
      border-radius: 18px;
      border: 1.5px solid #e9ecf0;
      overflow: hidden;
    }
    .agenda-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 12px;
      border-bottom: 1.5px solid #e9ecf0;
    }
    .agenda-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: #0d2055;
    }
    .agenda-range {
      font-size: 11px;
      color: #9ca3af;
      font-weight: 600;
    }
    .agenda-list { display: flex; flex-direction: column; }
    .agenda-item {
      display: flex;
      align-items: stretch;
      gap: 0;
      border-bottom: 1px solid #f1f5f9;
      text-align: left;
    }
    .agenda-item:last-child { border-bottom: none; }
    .agenda-day-col {
      width: 62px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px 8px;
      border-right: 1px solid #f1f5f9;
      background: #fff;
    }
    .agenda-dow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: #9ca3af;
      line-height: 1;
    }
    .agenda-day-num {
      font-size: 20px;
      font-weight: 800;
      color: #0d2055;
      line-height: 1.1;
    }
    .agenda-day-col.today .agenda-day-num {
      background: #0d2055;
      color: #fff;
      border-radius: 8px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .agenda-day-col.today .agenda-dow { color: #0d2055; }
    .agenda-accent {
      width: 3px;
      flex-shrink: 0;
    }
    .agenda-accent.partita    { background: #0d2055; }
    .agenda-accent.allenamento { background: #16a34a; }
    .agenda-content {
      flex: 1;
      padding: 12px 14px;
      min-width: 0;
    }
    .agenda-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .6px;
      text-transform: uppercase;
      border-radius: 5px;
      padding: 2px 7px;
      margin-bottom: 4px;
    }
    .agenda-badge.partita    { background: #eef4ff; color: #1d4ed8; }
    .agenda-badge.allenamento { background: #f0fdf4; color: #15803d; }
    .agenda-titolo {
      font-size: 14px;
      font-weight: 700;
      color: #111827;
      line-height: 1.3;
      margin-bottom: 5px;
    }
    .agenda-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 11px;
      color: #6b7280;
      font-weight: 500;
    }
    .agenda-meta span { display: flex; align-items: center; gap: 3px; }
    .agenda-squadra {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .4px;
      color: #9ca3af;
      margin-top: 4px;
    }
    .agenda-empty {
      padding: 24px 18px;
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      font-weight: 600;
    }

    /* ── Section label ── */
    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #9ca3af;
      text-align: left;
      margin-bottom: 12px;
    }

    /* ── Grid ── */
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 12px;
    }
    .btn-grid.single { grid-template-columns: 1fr; }
    .btn-grid.triple { grid-template-columns: repeat(3, 1fr); }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 22px 12px 18px;
      border-radius: 16px;
      border: 1.5px solid #e9ecf0;
      background: #fafbfc;
      cursor: default;
      font-family: inherit;
      transition: border-color .15s, background .15s;
      opacity: .55;
      position: relative;
      overflow: hidden;
      aspect-ratio: 1 / 1;
    }
    .tile-icon {
      font-size: 28px;
      line-height: 1;
    }
    .tile-label {
      font-size: 12px;
      font-weight: 700;
      color: #374151;
      line-height: 1.3;
      text-align: center;
    }
    .tile-soon {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: #9ca3af;
      background: #f3f4f6;
      border-radius: 5px;
      padding: 2px 6px;
    }

    /* Coach tile: compact horizontal row */
    .tile-coach {
      background: linear-gradient(145deg, #fff7ed, #fef3e8);
      border-color: #fed7aa;
      opacity: 1;
      aspect-ratio: auto;
      flex-direction: row;
      justify-content: flex-start;
      padding: 14px 18px;
      gap: 12px;
    }
    .tile-coach .tile-icon { font-size: 22px; }
    .tile-coach .tile-label { color: #c2410c; font-size: 14px; text-align: left; }
    .tile-coach .tile-soon { display: none; }

    /* ── Footer ── */
    .profile-footer {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 28px;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #0d2055;
      color: #fff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      transition: background .2s;
    }
    .btn-home:hover { background: #1535a8; }
    .btn-logout {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #fff;
      color: #6b7280;
      border: 1px solid #e5e7eb;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all .2s;
    }
    .btn-logout:hover { background: #f9fafb; color: #374151; border-color: #d1d5db; }

    @media (max-width: 480px) {
      .profile-card { padding: 32px 18px 32px; }
      .profile-name { font-size: 20px; }
      .btn-grid { gap: 10px; }
    }
  </style>
</head>
<body>
  <div class="profile-wrap">
    <div class="profile-card">
      <img class="profile-logo" src="images/positivo@4x.png" alt="Virtus Caserta" onerror="this.style.display='none'">

      <div class="profile-avatar" id="avatarInitials">VC</div>
      <div class="profile-name" id="profileName">…</div>

      <div class="profile-roles" id="profileRoles"></div>

      <!-- Impegni settimana -->
      <div class="agenda-section" id="agendaSection" style="display:none;">
        <div class="agenda-header">
          <span class="agenda-title">I tuoi impegni della settimana</span>
          <span class="agenda-range" id="agendaRange"></span>
        </div>
        <div class="agenda-list" id="agendaList">
          <div class="agenda-empty">Nessun impegno questa settimana</div>
        </div>
      </div>

      <div class="section-label">Area personale</div>

      <!-- Coach tile: visible only if allenatore -->
      <div class="btn-grid single" id="coachGrid" style="display:none; margin-bottom:12px;">
        <button class="tile tile-coach" disabled>
          <span class="tile-label">Gestione squadra</span>
        </button>
      </div>

      <!-- Main 2×2 grid -->
      <div class="btn-grid" id="mainGrid">
        <button class="tile" disabled>
          <span class="tile-soon">Presto</span>
          <span class="tile-label">Documenti</span>
        </button>
        <button class="tile" disabled>
          <span class="tile-soon">Presto</span>
          <span class="tile-label">Calendario</span>
        </button>
        <button class="tile" disabled>
          <span class="tile-soon">Presto</span>
          <span class="tile-label">Organizza partita</span>
        </button>
        <button class="tile" disabled>
          <span class="tile-soon">Presto</span>
          <span class="tile-label">Comunicazioni</span>
        </button>
      </div>

      <!-- MVP row full width -->
      <div class="btn-grid single">
        <button class="tile" disabled style="aspect-ratio: auto; flex-direction: row; justify-content: flex-start; gap: 14px; padding: 18px 20px;">
          <span class="tile-soon">Presto</span>
          <span class="tile-label" style="font-size:14px; text-align:left;">Vota l'MVP della partita</span>
        </button>
      </div>

      <div class="profile-footer">
        <a href="/" class="btn-home">← Home</a>
        <button class="btn-logout" onclick="doLogout()">Esci</button>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('vc_token');
    const adminToken = localStorage.getItem('vc_admin_token');
    if (!token && !adminToken) { location.replace('/login'); }

    async function loadProfile() {
      const cached = localStorage.getItem('vc_user');
      if (cached) {
        try {
          const u = JSON.parse(cached);
          renderName(u.nome, u.cognome);
        } catch (_) {}
      }
      if (!token) return;
      try {
        const [profRes, evRes] = await Promise.all([
          fetch('/api/profilo',          { headers: { Authorization: 'Bearer ' + token } }),
          fetch('/api/profilo/prossimi', { headers: { Authorization: 'Bearer ' + token } }),
        ]);
        if (profRes.ok) {
          const u = await profRes.json();
          renderName(u.nome, u.cognome);
          renderRoles(u);
          if (u.is_allenatore) document.getElementById('coachGrid').style.display = 'grid';
        }
        if (evRes.ok) {
          const data = await evRes.json();
          renderAgenda(data);
        }
      } catch (_) {}
    }

    const GIORNI = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
    const MESI_SHORT = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];

    function renderAgenda(data) {
      const section = document.getElementById('agendaSection');
      const list    = document.getElementById('agendaList');
      const rangeEl = document.getElementById('agendaRange');
      const eventi  = data.eventi || [];

      // Range label
      if (data.settimana) {
        const da = new Date(data.settimana.da + 'T00:00');
        const a  = new Date(data.settimana.a  + 'T00:00');
        rangeEl.textContent = `${da.getDate()} – ${a.getDate()} ${MESI_SHORT[a.getMonth()]}`;
      }

      section.style.display = 'block';
      list.innerHTML = '';

      if (!eventi.length) {
        list.innerHTML = '<div class="agenda-empty">Nessun impegno questa settimana 🎉</div>';
        return;
      }

      const oggi = new Date(); oggi.setHours(0,0,0,0);

      for (const ev of eventi) {
        let dateObj, oraStr = '', isToday = false;
        if (ev.tipo === 'partita') {
          dateObj = new Date(ev.data_ora);
          oraStr  = dateObj.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
        } else {
          dateObj = new Date(ev.data + 'T00:00');
          oraStr  = ev.ora || '';
        }
        const dayDate = new Date(dateObj); dayDate.setHours(0,0,0,0);
        isToday = dayDate.getTime() === oggi.getTime();

        const dow     = GIORNI[dateObj.getDay()];
        const dayNum  = dateObj.getDate();

        const item = document.createElement('div');
        item.className = 'agenda-item';
        item.innerHTML = `
          <div class="agenda-day-col${isToday ? ' today' : ''}">
            <span class="agenda-dow">${dow}</span>
            <span class="agenda-day-num">${dayNum}</span>
          </div>
          <div class="agenda-accent ${ev.tipo}"></div>
          <div class="agenda-content">
            <div class="agenda-badge ${ev.tipo}">${ev.tipo === 'partita' ? 'Partita' : 'Allenamento'}</div>
            <div class="agenda-titolo">${ev.tipo === 'partita' ? ev.casa + ' vs ' + ev.ospite : (ev.titolo || 'Allenamento')}</div>
            <div class="agenda-meta">
              ${oraStr ? `<span>Ore: ${oraStr}</span>` : ''}
              ${ev.luogo ? `<span>Dove: ${ev.luogo}</span>` : ''}
              ${ev.tipo === 'partita' && ev.giornata ? `<span>${ev.giornata}</span>` : ''}
            </div>
            ${ev.squadra ? `<div class="agenda-squadra">${ev.squadra}</div>` : ''}
          </div>`;
        list.appendChild(item);
      }
    }

    function renderName(nome, cognome) {
      const full = [nome, cognome].filter(Boolean).join(' ');
      document.getElementById('profileName').textContent = full || 'Utente';
      const initials = [nome, cognome]
        .filter(Boolean)
        .map(s => s[0].toUpperCase())
        .join('');
      document.getElementById('avatarInitials').textContent = initials || 'U';
    }

    function parseRuolo(raw) {
      if (!raw) return null;
      if (typeof raw === 'object') return raw;
      try { return JSON.parse(raw); } catch (_) { return null; }
    }

    function renderRoles(u) {
      const container = document.getElementById('profileRoles');
      container.innerHTML = '';

      if (u.is_atleta) {
        const map = parseRuolo(u.ruolo_atleta);
        if (map && typeof map === 'object' && !Array.isArray(map)) {
          for (const [cat, ruolo] of Object.entries(map)) {
            const b = document.createElement('span');
            b.className = 'role-pill role-atleta';
            b.innerHTML = `<span class="pill-dot"></span><span class="pill-tipo">Atleta</span> in: ${cat} come ${ruolo}`;
            container.appendChild(b);
          }
        } else {
          const b = document.createElement('span');
          b.className = 'role-pill role-atleta';
          b.innerHTML = `<span class="pill-dot"></span><span class="pill-tipo">Atleta</span>`;
          container.appendChild(b);
        }
      }

      if (u.is_allenatore) {
        const map = parseRuolo(u.ruolo_allenatore);
        if (map && typeof map === 'object' && !Array.isArray(map)) {
          for (const [cat, ruolo] of Object.entries(map)) {
            const b = document.createElement('span');
            b.className = 'role-pill role-allenatore';
            b.innerHTML = `<span class="pill-dot"></span><span class="pill-tipo">Allenatore</span> in: ${cat} come ${ruolo}`;
            container.appendChild(b);
          }
        } else {
          const b = document.createElement('span');
          b.className = 'role-pill role-allenatore';
          b.innerHTML = `<span class="pill-dot"></span><span class="pill-tipo">Allenatore</span>`;
          container.appendChild(b);
        }
      }
    }

    function doLogout() {
      ['vc_token','vc_admin_token','vc_role','vc_nome','vc_user'].forEach(k => localStorage.removeItem(k));
      location.replace('/');
    }

    loadProfile();
  </script>
</body>
</html>
