<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/images/favicon/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/images/favicon/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/images/favicon/site.webmanifest">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizza partita – Virtus Caserta</title>
  <link rel="stylesheet" href="common.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#f7f8fa;min-height:100vh;display:flex;flex-direction:column;}
    .page-wrap{flex:1;max-width:600px;width:100%;margin:0 auto;padding:32px 20px 64px;}
    .top-bar{display:flex;align-items:center;gap:14px;margin-bottom:28px;}
    .btn-back{display:inline-flex;align-items:center;gap:6px;color:#0d2055;text-decoration:none;
      font-size:13px;font-weight:700;padding:8px 14px;border-radius:10px;border:1.5px solid #e9ecf0;
      background:#fff;transition:all .2s;}
    .btn-back:hover{border-color:#0d2055;background:#eef4ff;}
    .page-title{font-size:20px;font-weight:800;color:#0d2055;letter-spacing:-.02em;}

    /* ── Form card ── */
    .form-card{background:#fff;border-radius:20px;border:1.5px solid #e9ecf0;padding:28px 24px;
      box-shadow:0 2px 20px rgba(13,32,85,.06);margin-bottom:24px;}
    .form-section-title{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
      color:#9ca3af;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid #f1f5f9;}
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;}
    .field:last-child{margin-bottom:0;}
    .field label{font-size:12px;font-weight:700;color:#374151;}
    .field input,.field select,.field textarea{
      padding:11px 14px;border:1.5px solid #e9ecf0;border-radius:12px;
      font-size:14px;font-family:inherit;outline:none;transition:border-color .2s;width:100%;background:#fff;}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:#0d2055;}
    .field textarea{resize:vertical;min-height:88px;}
    .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .field-hint{font-size:11px;color:#9ca3af;margin-top:2px;}

    /* ── Step label ── */
    .step-label{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
      color:#0d2055;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
    .step-num{width:20px;height:20px;border-radius:50%;background:#0d2055;color:#fff;
      font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}

    /* ── Palestre disponibili ── */
    .palestre-grid{display:flex;flex-direction:column;gap:10px;}
    .palestra-card{border:1.5px solid #e9ecf0;border-radius:14px;padding:14px 16px;
      background:#fafbfc;transition:border-color .15s;}
    .palestra-card-nome{font-size:13px;font-weight:700;color:#111827;margin-bottom:2px;}
    .palestra-card-addr{font-size:11px;color:#9ca3af;margin-bottom:10px;}
    .slot-list{display:flex;flex-wrap:wrap;gap:8px;}
    .slot-btn{padding:7px 14px;border-radius:20px;border:1.5px solid #e9ecf0;background:#fff;
      font-size:12px;font-weight:700;color:#374151;cursor:pointer;transition:all .15s;font-family:inherit;
      display:flex;align-items:center;gap:6px;}
    .slot-btn:hover{border-color:#16a34a;background:#f0fdf4;color:#15803d;}
    .slot-btn.selected{border-color:#0d2055;background:#eef4ff;color:#0d2055;}
    .slot-dot{width:7px;height:7px;border-radius:50%;background:#16a34a;flex-shrink:0;}
    .slot-btn.selected .slot-dot{background:#0d2055;}
    .no-palestre{text-align:center;padding:24px 16px;color:#9ca3af;font-size:13px;font-weight:600;
      background:#fafbfc;border-radius:14px;border:1.5px dashed #e9ecf0;}

    /* ── Selezione attiva ── */
    .selezione-card{border:1.5px solid #0d2055;border-radius:14px;padding:14px 16px;
      background:#eef4ff;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;}
    .selezione-info{flex:1;min-width:0;}
    .selezione-nome{font-size:14px;font-weight:700;color:#0d2055;}
    .selezione-orario{font-size:13px;color:#374151;margin-top:2px;}
    .btn-cambia{padding:6px 12px;border-radius:8px;border:1.5px solid #0d2055;background:#fff;
      font-size:12px;font-weight:700;color:#0d2055;cursor:pointer;transition:all .15s;white-space:nowrap;}
    .btn-cambia:hover{background:#eef4ff;}

    /* ── Orario manuale ── */
    .orario-row{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:16px;}
    .orario-sep{font-size:16px;color:#9ca3af;text-align:center;font-weight:700;}

    /* ── Pending list ── */
    .list-card{background:#fff;border-radius:20px;border:1.5px solid #e9ecf0;overflow:hidden;
      box-shadow:0 2px 16px rgba(13,32,85,.05);}
    .list-header{padding:14px 20px 12px;border-bottom:1.5px solid #e9ecf0;display:flex;align-items:center;justify-content:space-between;}
    .list-title{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#0d2055;}
    .match-item{display:flex;gap:14px;padding:16px 20px;border-bottom:1px solid #f1f5f9;align-items:center;}
    .match-item:last-child{border-bottom:none;}
    .match-icon{width:42px;height:42px;border-radius:12px;background:#eef4ff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
    .match-info{flex:1;min-width:0;}
    .match-vs{font-size:14px;font-weight:700;color:#111827;}
    .match-meta{font-size:12px;color:#9ca3af;margin-top:2px;display:flex;flex-wrap:wrap;gap:8px;}
    .match-status{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;}
    .match-status.pending{background:#fef3c7;color:#92400e;}
    .match-status.accepted{background:#f0fdf4;color:#15803d;}
    .match-status.refused{background:#fef2f2;color:#b91c1c;}
    .list-empty{padding:36px 20px;text-align:center;color:#9ca3af;font-size:13px;font-weight:600;}

    /* ── Accepted match management card ── */
    .match-card-accepted{background:#fff;border:2px solid #16a34a;border-radius:16px;overflow:hidden;margin-bottom:12px;box-shadow:0 2px 12px rgba(22,163,74,.08);}
    .mca-header{background:linear-gradient(135deg,#f0fdf4,#dcfce7);padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-bottom:1px solid #bbf7d0;}
    .mca-badge{font-size:11px;font-weight:800;background:#16a34a;color:#fff;border-radius:20px;padding:3px 10px;white-space:nowrap;}
    .mca-date{font-size:13px;font-weight:700;color:#15803d;}
    .mca-luogo{font-size:12px;color:#166534;}
    .mca-body{padding:14px 18px;}
    .mca-section{margin-bottom:12px;}
    .mca-section-lbl{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#6b7280;margin-bottom:6px;}
    .mca-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;background:#eef4ff;color:#0d2055;font-size:12px;font-weight:600;margin:2px;}
    .mca-btn{padding:8px 16px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;font-family:inherit;}
    .mca-btn-gestisci{background:#eef4ff;color:#0d2055;margin-top:6px;}
    .mca-btn-gestisci:hover{background:#dbeafe;}
    .mca-btn-salva{background:#0d2055;color:#fff;margin-top:10px;}
    .mca-btn-salva:hover{background:#1535a8;}
    .mca-people-wrap{margin-top:10px;padding:12px;background:#f9fafb;border-radius:12px;border:1.5px solid #e9ecf0;}

    /* ── Submit ── */
    .btn-submit{width:100%;padding:15px;background:#0d2055;color:#fff;border:none;border-radius:14px;
      font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:6px;}
    .btn-submit:hover{background:#1535a8;transform:translateY(-1px);}
    .btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none;}

    .spin{display:inline-block;width:18px;height:18px;border:2.5px solid #e2e8f0;border-top-color:#0d2055;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* ── Toast ── */
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
      background:#111827;color:#fff;padding:11px 20px;border-radius:50px;font-size:13px;font-weight:600;
      opacity:0;transition:transform .3s,opacity .3s;z-index:900;white-space:nowrap;}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .toast.err{background:#dc2626;}

    /* ── People search ── */
    .people-search{position:relative;margin-bottom:10px;}
    .people-search input{padding:10px 14px 10px 38px;}
    .search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9ca3af;font-size:14px;pointer-events:none;}
    .people-results{max-height:200px;overflow-y:auto;border:1.5px solid #e9ecf0;border-radius:12px;background:#fff;scrollbar-width:thin;}
    .person-row{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:background .12s;border-bottom:1px solid #f1f5f9;}
    .person-row:last-child{border-bottom:none;}
    .person-row:hover{background:#f9fafb;}
    .person-row.sel{background:#eef4ff;}
    .person-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(140deg,#0d2055,#1e4bd8);
      display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0;}
    .person-info{flex:1;min-width:0;}
    .person-name{font-size:13px;font-weight:600;color:#111827;}
    .person-check{width:18px;height:18px;border-radius:50%;border:2px solid #d1d5db;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;
      transition:all .15s;color:#fff;}
    .person-row.sel .person-check{background:#0d2055;border-color:#0d2055;}
    .sel-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
    .sel-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 5px 4px 10px;border-radius:20px;
      background:#eef4ff;color:#0d2055;font-size:12px;font-weight:700;}
    .sel-chip button{background:none;border:none;color:#93c5fd;cursor:pointer;font-size:13px;
      padding:0 3px;line-height:1;border-radius:50%;transition:color .15s;}
    .sel-chip button:hover{color:#0d2055;}
    .invite-summary{font-size:11px;color:#9ca3af;margin-top:10px;}
    .invite-summary strong{color:#0d2055;}

    @media(max-width:480px){
      .page-wrap{padding:20px 14px 48px;}
      .top-bar{gap:10px;}
      .btn-back{font-size:12px;padding:7px 12px;}
      .page-title{font-size:18px;}
      .form-card{padding:20px 16px;border-radius:16px;}
      .list-card{border-radius:16px;}
      .field-row{grid-template-columns:1fr;}
      .orario-row{grid-template-columns:1fr auto 1fr;}
      /* prevent iOS zoom */
      .field input,.field select,.field textarea,
      .people-search input{font-size:16px!important;width:100%;}
      /* match-item: tighter padding, info truncated */
      .match-item{padding:12px 14px;flex-wrap:wrap;gap:8px;}
      .match-icon{align-self:flex-start;}
      .match-info{overflow:hidden;}
      .match-vs{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .match-status{margin-left:calc(42px + 8px);font-size:11px;}
      /* selezione card */
      .selezione-card{flex-wrap:wrap;}
      .selezione-nome{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
      .btn-cambia{align-self:flex-end;}
      /* slot buttons */
      .slot-btn{font-size:11px;padding:6px 10px;}
    }
    @media(max-width:360px){
      .orario-row{grid-template-columns:1fr;gap:6px;}
      .orario-sep{display:none;}
      .match-item{padding:10px 12px;}
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="top-bar">
      <a href="/utente" class="btn-back">← Account</a>
      <h1 class="page-title">Organizza partita</h1>
    </div>

    <!-- STEP 1 + 2 + 3 in unica card -->
    <div class="form-card">
      <!-- Step 1: Data -->
      <div class="step-label"><span class="step-num">1</span>Scegli la data</div>
      <div class="field" style="margin-bottom:20px;">
        <input type="date" id="fData" onchange="onDataChange()">
      </div>

      <!-- Step 2: Palestre disponibili (nascosto finché data non selezionata) -->
      <div id="palestreSection" style="display:none;">
        <div class="step-label"><span class="step-num">2</span>Palestra disponibile</div>
        <div id="palestreGrid" class="palestre-grid" style="margin-bottom:20px;">
          <div style="text-align:center;padding:16px;color:#9ca3af;font-size:13px;"><div class="spin"></div></div>
        </div>
      </div>

      <!-- Step 3: Orario + dettagli (nascosto finché slot non selezionato) -->
      <div id="orarioSection" style="display:none;">
        <div class="step-label"><span class="step-num">3</span>Conferma orario</div>

        <!-- Selezione attiva -->
        <div class="selezione-card" id="selezioneCard">
          <div class="selezione-info">
            <div class="selezione-nome" id="selNome">—</div>
            <div class="selezione-orario" id="selOrario">—</div>
          </div>
          <button class="btn-cambia" onclick="cambiaSelezione()">Cambia</button>
        </div>

        <!-- Orario fine-tune -->
        <div class="field" style="margin-bottom:16px;">
          <label>Aggiusta orario (opzionale)</label>
          <div class="orario-row">
            <div>
              <label style="font-size:11px;color:#9ca3af;font-weight:600;display:block;margin-bottom:4px;">Inizio</label>
              <input type="time" id="fOra" style="padding:9px 12px;border:1.5px solid #e9ecf0;border-radius:10px;font-size:14px;font-family:inherit;outline:none;width:100%;">
            </div>
            <div class="orario-sep">–</div>
            <div>
              <label style="font-size:11px;color:#9ca3af;font-weight:600;display:block;margin-bottom:4px;">Fine</label>
              <input type="time" id="fOraFine" style="padding:9px 12px;border:1.5px solid #e9ecf0;border-radius:10px;font-size:14px;font-family:inherit;outline:none;width:100%;">
            </div>
          </div>
        </div>

        <div class="field">
          <label>Note aggiuntive</label>
          <textarea id="fNote" placeholder="Informazioni per lo staff e i giocatori…"></textarea>
        </div>
      </div>

      <!-- Fallback luogo manuale se nessuna palestra (sezione sempre visibile quando data scelta) -->
      <div id="luogoFallback" style="display:none;">
        <div class="field">
          <label>Luogo</label>
          <input type="text" id="fLuogo" placeholder="Es. Tenda di Abramo, Caserta">
        </div>
      </div>

      <!-- Hidden: palestra_id selezionata -->
      <input type="hidden" id="fPalestra">
    </div>

    <!-- Inviti: solo per persona -->
    <div class="form-card">
      <div class="form-section-title">Invita partecipanti</div>
      <div class="people-search">
        <span class="search-ico">🔍</span>
        <input type="text" id="peopleSearch" placeholder="Cerca per nome…" oninput="filterPeople(this.value)">
      </div>
      <div class="people-results" id="peopleResults">
        <div style="padding:16px;text-align:center;color:#9ca3af;font-size:13px;">Caricamento…</div>
      </div>
      <div class="sel-chips" id="selChips"></div>
      <div class="invite-summary" id="persSummary"></div>
    </div>

    <button class="btn-submit" id="btnSubmit" onclick="invia()">Proponi partita</button>

    <!-- Partite proposte -->
    <div class="list-card" style="margin-top:32px;">
      <div class="list-header">
        <span class="list-title">Partite proposte</span>
      </div>
      <div id="matchList">
        <div class="list-empty"><div class="spin"></div> Caricamento…</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    fetch('/api/me').then(r=>r.json()).then(d=>{ if(!d.auth) location.replace('/login'); }).catch(()=>location.replace('/login'));
    const _tok = '';

    document.getElementById('fData').valueAsDate = new Date();

    // ── Palestre cache ──
    let _orgPalestre = [];

    async function caricaPalestre() {
      try {
        const r = await fetch('/api/palestre');
        _orgPalestre = await r.json();
      } catch {}
    }

    // ── Step 1: data cambia → carica palestre disponibili ──
    async function onDataChange() {
      const data = document.getElementById('fData').value;
      if (!data) return;

      // Reset step 3
      resetSelezione();

      const palestreSection = document.getElementById('palestreSection');
      const grid = document.getElementById('palestreGrid');
      palestreSection.style.display = '';
      grid.innerHTML = '<div style="text-align:center;padding:16px;color:#9ca3af;font-size:13px;"><div class="spin"></div> Caricamento…</div>';

      if (!_orgPalestre.length) await caricaPalestre();

      try {
        const results = await Promise.all(
          _orgPalestre.map(p =>
            fetch(`/api/palestre/${p.id}/occupazione?data=${data}`)
              .then(r => r.json())
              .then(occ => ({ ...p, disponibili: occ.disponibili || [], occupati: occ.occupati || [] }))
              .catch(() => ({ ...p, disponibili: [], occupati: [] }))
          )
        );

        const conSlot = results.filter(p => p.disponibili.length > 0 || p.occupati.length > 0);

        if (!conSlot.length) {
          grid.innerHTML = '<div class="no-palestre">Nessuna palestra disponibile per questa data.<br><span style="font-size:12px;font-weight:400;">Puoi inserire comunque il luogo manualmente.</span></div>';
          document.getElementById('luogoFallback').style.display = '';
          return;
        }

        document.getElementById('luogoFallback').style.display = 'none';
        grid.innerHTML = '';

        conSlot.forEach(p => {
          const card = document.createElement('div');
          card.className = 'palestra-card';
          card.id = `pcard-${p.id}`;

          let slotsHtml = '';
          p.disponibili.forEach(s => {
            slotsHtml += `<button class="slot-btn" data-palestra="${p.id}" data-nome="${p.nome.replace(/"/g,'&quot;')}" data-inizio="${s.inizio}" data-fine="${s.fine}" onclick="selezionaSlot(this)">
              <span class="slot-dot"></span>${s.inizio}–${s.fine}
            </button>`;
          });
          p.occupati.forEach(s => {
            slotsHtml += `<span class="slot-btn" style="opacity:.45;cursor:not-allowed;border-color:#fecaca;background:#fef2f2;color:#b91c1c;">
              <span class="slot-dot" style="background:#dc2626;"></span>${s.inizio}–${s.fine}
            </span>`;
          });

          card.innerHTML = `
            <div class="palestra-card-nome">${p.nome}</div>
            ${p.indirizzo ? `<div class="palestra-card-addr">${p.indirizzo}</div>` : ''}
            <div class="slot-list">${slotsHtml}</div>`;
          grid.appendChild(card);
        });

      } catch {
        grid.innerHTML = '<div class="no-palestre" style="color:#dc2626;">Errore di caricamento palestre.</div>';
      }
    }

    // ── Step 2: click su slot ──
    function selezionaSlot(btn) {
      // Deseleziona tutti
      document.querySelectorAll('.slot-btn.selected').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');

      const pid    = btn.dataset.palestra;
      const nome   = btn.dataset.nome;
      const inizio = btn.dataset.inizio;
      const fine   = btn.dataset.fine;
      const data   = document.getElementById('fData').value;

      document.getElementById('fPalestra').value = pid;
      document.getElementById('fOra').value      = inizio;
      document.getElementById('fOraFine').value  = fine;

      const dd = new Date(data + 'T00:00:00');
      const dataFmt = dd.toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long' });

      document.getElementById('selNome').textContent    = nome;
      document.getElementById('selOrario').textContent  = `${dataFmt} · ${inizio}–${fine}`;

      document.getElementById('orarioSection').style.display = '';
      document.getElementById('orarioSection').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function cambiaSelezione() {
      resetSelezione();
    }

    function resetSelezione() {
      document.getElementById('orarioSection').style.display = 'none';
      document.getElementById('fPalestra').value = '';
      document.getElementById('fOra').value = '';
      document.getElementById('fOraFine').value = '';
      document.querySelectorAll('.slot-btn.selected').forEach(b => b.classList.remove('selected'));
    }

    // ── Persone ──
    let invitatiPers = new Map();
    let allPeople    = [];
    let peopleLoaded = false;
    let _myId = '';

    async function caricaPersone() {
      if (!_myId) {
        try { const d = await fetch('/api/me').then(r => r.json()); _myId = d.id ? String(d.id) : ''; } catch {}
      }
      const res = document.getElementById('peopleResults');
      res.innerHTML = '<div style="padding:16px;text-align:center;color:#9ca3af;font-size:13px;"><div class="spin"></div> Caricamento…</div>';
      try {
        const r = await fetch('/api/utenti', { headers: { Authorization: `Bearer ${_tok}` } });
        if (!r.ok) throw new Error('Status ' + r.status);
        const all = await r.json();
        allPeople = all.filter(p => String(p.id) !== _myId);
        peopleLoaded = true;
        filterPeople('');
      } catch (e) {
        res.innerHTML = `<div style="padding:16px;text-align:center;color:#9ca3af;font-size:13px;">Impossibile caricare gli utenti (${e.message})</div>`;
      }
    }

    function filterPeople(q) {
      if (!peopleLoaded) { caricaPersone(); return; }
      const list = q.trim()
        ? allPeople.filter(p => `${p.nome||''} ${p.cognome||''}`.toLowerCase().includes(q.toLowerCase()))
        : allPeople;
      const res = document.getElementById('peopleResults');
      if (!list.length) { res.innerHTML = '<div style="padding:16px;text-align:center;color:#9ca3af;font-size:13px;">Nessun risultato</div>'; return; }
      res.innerHTML = '';
      list.forEach(p => {
        const isSel = invitatiPers.has(p.id);
        const ini   = [p.nome, p.cognome].filter(Boolean).map(s => s[0].toUpperCase()).join('') || '?';
        const row   = document.createElement('div');
        row.className = 'person-row' + (isSel ? ' sel' : '');
        row.innerHTML = `
          <div class="person-av">${ini}</div>
          <div class="person-info"><div class="person-name">${p.nome||''} ${p.cognome||''}</div></div>
          <div class="person-check">${isSel ? '✓' : ''}</div>`;
        row.addEventListener('click', () => {
          invitatiPers.has(p.id) ? invitatiPers.delete(p.id) : invitatiPers.set(p.id, p);
          filterPeople(document.getElementById('peopleSearch').value);
          renderSelChips();
        });
        res.appendChild(row);
      });
    }

    function renderSelChips() {
      const c = document.getElementById('selChips');
      const s = document.getElementById('persSummary');
      c.innerHTML = '';
      for (const [id, p] of invitatiPers) {
        const chip = document.createElement('span');
        chip.className = 'sel-chip';
        chip.innerHTML = `${p.nome||''} ${p.cognome||''}<button>✕</button>`;
        chip.querySelector('button').addEventListener('click', () => {
          invitatiPers.delete(id);
          filterPeople(document.getElementById('peopleSearch').value);
          renderSelChips();
        });
        c.appendChild(chip);
      }
      const n = invitatiPers.size;
      s.innerHTML = n ? `<strong>${n}</strong> person${n > 1 ? 'e' : 'a'} selezionat${n > 1 ? 'e' : 'a'}` : '';
    }

    function toast(msg, err = false) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
      clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 3500);
    }

    // ── Invio ──
    async function invia() {
      const data    = document.getElementById('fData').value;
      const ora     = document.getElementById('fOra').value;
      const oraFine = document.getElementById('fOraFine').value;
      if (!data) { alert('Seleziona una data'); return; }
      if (!ora)  { alert('Seleziona un orario dalla palestra disponibile'); return; }
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true; btn.textContent = 'Invio…';
      try {
        const r = await fetch('/api/partite/proposta', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_tok}` },
          body: JSON.stringify({
            data, ora,
            ora_fine:    oraFine || null,
            luogo:       document.getElementById('fLuogo').value.trim(),
            note:        document.getElementById('fNote').value.trim(),
            palestra_id: document.getElementById('fPalestra').value || null,
            invitati_categorie: [],
            invitati_persone:   [...invitatiPers.keys()],
          })
        });
        if (!r.ok) throw new Error('Errore ' + r.status);
        toast('Proposta inviata allo staff!');
        document.getElementById('fNote').value = '';
        document.getElementById('fLuogo').value = '';
        resetSelezione();
        invitatiPers.clear();
        renderSelChips();
        caricaProposte();
      } catch (e) {
        toast('Errore: ' + e.message, true);
      } finally {
        btn.disabled = false; btn.textContent = 'Proponi partita';
      }
    }

    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso + (iso.includes('T') ? '' : 'T00:00'));
      return d.toLocaleDateString('it-IT', { weekday: 'short', day: '2-digit', month: 'short' });
    }

    // Per-card invitati state: proposalId → Set of user ids
    const _cardInvitati = {};

    async function caricaProposte() {
      const list = document.getElementById('matchList');
      try {
        const r = await fetch('/api/partite/proposte', { headers: { Authorization: `Bearer ${_tok}` } });
        if (!r.ok) throw new Error();
        const items = await r.json();
        if (!items.length) { list.innerHTML = '<div class="list-empty">Nessuna proposta inviata</div>'; return; }
        list.innerHTML = '';
        items.forEach(m => {
          const stato  = m.stato || 'pending';
          const orario = String(m.ora||'').slice(0,5) + (m.ora_fine ? ' – ' + String(m.ora_fine).slice(0,5) : '');
          if (stato === 'accepted') {
            _cardInvitati[m.id] = new Set((m.invitati_persone || []).map(String));
            const nomi = (m.invitati_nomi || []);
            const div = document.createElement('div');
            div.className = 'match-card-accepted';
            div.id = 'mca-' + m.id;
            div.innerHTML = `
              <div class="mca-header">
                <span class="mca-badge">✓ Accettata</span>
                <span class="mca-date">📅 ${fmtDate(m.data)} · ⏰ ${orario}</span>
                ${m.luogo ? `<span class="mca-luogo">📍 ${m.luogo}</span>` : ''}
              </div>
              <div class="mca-body">
                <div class="mca-section">
                  <div class="mca-section-lbl">Partecipanti invitati</div>
                  <div id="mca-chips-${m.id}">
                    ${nomi.length ? nomi.map(n=>`<span class="mca-chip">👤 ${n}</span>`).join('') : '<span style="color:#9ca3af;font-size:13px;">Nessuno ancora</span>'}
                  </div>
                </div>
                <button class="mca-btn mca-btn-gestisci" onclick="toggleCardInvitati('${m.id}')">+ Gestisci partecipanti</button>
                <div id="mca-edit-${m.id}" style="display:none;">
                  <div class="mca-people-wrap">
                    <input type="text" id="mca-search-${m.id}" placeholder="Cerca per nome…"
                      oninput="filterCardPeople('${m.id}', this.value)"
                      style="width:100%;padding:9px 12px;border:1.5px solid #e9ecf0;border-radius:10px;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box;margin-bottom:8px;">
                    <div id="mca-results-${m.id}" class="people-results" style="max-height:160px;"></div>
                    <div id="mca-sel-chips-${m.id}" class="sel-chips" style="margin-top:8px;"></div>
                  </div>
                  <button class="mca-btn mca-btn-salva" onclick="salvaCardInvitati('${m.id}')">Salva partecipanti</button>
                </div>
              </div>`;
            list.appendChild(div);
          } else {
            const STATUS = { pending: 'In attesa', refused: 'Rifiutata' };
            const item = document.createElement('div');
            item.className = 'match-item';
            item.innerHTML = `
              <div class="match-icon">🏐</div>
              <div class="match-info">
                <div class="match-vs">${fmtDate(m.data)}</div>
                <div class="match-meta">
                  <span>${orario}</span>
                  ${m.luogo ? `<span>${m.luogo}</span>` : ''}
                </div>
              </div>
              <span class="match-status ${stato}">${STATUS[stato] || stato}</span>`;
            list.appendChild(item);
          }
        });
      } catch {
        list.innerHTML = '<div class="list-empty">Impossibile caricare le proposte</div>';
      }
    }

    function toggleCardInvitati(id) {
      const el = document.getElementById('mca-edit-' + id);
      if (!el) return;
      const open = el.style.display !== 'none';
      el.style.display = open ? 'none' : 'block';
      if (!open) {
        filterCardPeople(id, '');
        renderCardChips(id);
      }
    }

    function filterCardPeople(id, q) {
      if (!peopleLoaded) return;
      const set = _cardInvitati[id] || new Set();
      const list = q.trim()
        ? allPeople.filter(p => `${p.nome||''} ${p.cognome||''}`.toLowerCase().includes(q.toLowerCase()))
        : allPeople;
      const res = document.getElementById('mca-results-' + id);
      if (!res) return;
      if (!list.length) { res.innerHTML = '<div style="padding:10px 14px;font-size:13px;color:#9ca3af;">Nessun risultato</div>'; return; }
      res.innerHTML = '';
      list.forEach(p => {
        const sel = set.has(String(p.id));
        const ini = [p.nome, p.cognome].filter(Boolean).map(s=>s[0].toUpperCase()).join('') || '?';
        const row = document.createElement('div');
        row.className = 'person-row' + (sel ? ' sel' : '');
        row.innerHTML = `<div class="person-av">${ini}</div>
          <div class="person-info"><div class="person-name">${p.nome||''} ${p.cognome||''}</div></div>
          <div class="person-check">${sel?'✓':''}</div>`;
        row.onclick = () => {
          if (set.has(String(p.id))) set.delete(String(p.id));
          else set.add(String(p.id));
          _cardInvitati[id] = set;
          filterCardPeople(id, document.getElementById('mca-search-'+id)?.value || '');
          renderCardChips(id);
        };
        res.appendChild(row);
      });
    }

    function renderCardChips(id) {
      const set = _cardInvitati[id] || new Set();
      const el = document.getElementById('mca-sel-chips-' + id);
      if (!el) return;
      const selected = allPeople.filter(p => set.has(String(p.id)));
      el.innerHTML = selected.map(p => {
        const nome = `${p.nome||''} ${p.cognome||''}`.trim();
        return `<span class="sel-chip">${nome}<button onclick="removeCardInvitato('${id}',${p.id})">×</button></span>`;
      }).join('');
    }

    window.removeCardInvitato = function(id, uid) {
      (_cardInvitati[id] || new Set()).delete(String(uid));
      filterCardPeople(id, document.getElementById('mca-search-'+id)?.value || '');
      renderCardChips(id);
    };

    window.salvaCardInvitati = async function(id) {
      const ids = [...(_cardInvitati[id] || new Set())].map(Number).filter(Boolean);
      try {
        const r = await fetch(`/api/partite/proposte/${id}/invitati`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ invitati_persone: ids })
        });
        if (!r.ok) throw new Error('Status ' + r.status);
        toast('Partecipanti salvati!');
        caricaProposte();
      } catch (e) {
        toast('Errore: ' + e.message, true);
      }
    };

    // ── Init ──
    caricaPalestre();
    caricaPersone();
    caricaProposte();
    // Carica subito palestre per la data di oggi
    onDataChange();
  </script>
</body>
</html>
